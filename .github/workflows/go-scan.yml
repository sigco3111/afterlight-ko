name: go-scan
on:
  push:
    paths:
      - 'go/**'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 확인
        run: node --check go/ko3-scan.mjs
      - name: 스캔
        run: node go/ko3-scan.mjs
        env:
          MODE: runtime
      - name: 산출물
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko3-out
          path: go/out
