name: go-scan
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 스캔
        run: node go/scan.mjs
      - name: 적용
        run: if [ -f go/fix.mjs ]; then node go/fix.mjs || echo "fix failed"; fi
      - name: 사전 수정
        run: if [ -f go/fix3.mjs ]; then node go/fix3.mjs || echo "fix3 failed"; fi
      - name: 보고서 커밋
        run: |
          git config user.name "ko-scan-bot"
          git config user.email "ko-scan-bot@users.noreply.github.com"
          git add -A go
          git commit -m "스캔: 영문 문자열 보고서 [skip ci]" || echo "no change"
          git push
