name: ko-clean
on:
  push:
    paths:
      - '.github/workflows/ko-clean.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cleanup
        run: |
          git rm -f .github/workflows/ko-clean.yml .github/workflows/ko-fix.yml .github/workflows/ko-saves.yml .github/workflows/ko-docs.yml || true
          git rm -f tools/fix-build.mjs tools/extract-strings.mjs || true
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git commit -m '정리: 임시 워크플로·도구 삭제' || true
          git push
