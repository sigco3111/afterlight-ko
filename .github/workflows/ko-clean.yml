name: koclean
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/ko-clean.yml'
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 임시 파일 삭제 커밋
        run: |
          git config user.name ko2-bot
          git config user.email ko2-bot@users.noreply.github.com
          git rm -r -q go
          git rm -q .github/workflows/ko3.yml .github/workflows/ko-clean.yml
          git commit -m "정리: 임시 워크플로·스크립트 삭제 [skip ci]"
          git push origin HEAD:main
