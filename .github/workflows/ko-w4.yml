name: ko-w4
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write parts
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          cat > i18n/parts/ch9c.json <<'KJSON'
          {"You shut the censer. The smoke thins and stops. Half of the hymn goes with it.":"향로를 닫는다. 연기가 엷어지며 멈춘다. 찬송의 절반이 함께 꺼진다.","The ward around the mainmast cracks like a bell dropped on stone. High above, in the torn mainsail, something enormous unfolds.":"주 돛대 둘레의 결계가 돌에 떨어진 종처럼 갈라진다. 저 높이, 찢어진 주 돛에서 거대한 무언가가 펼쳐진다.","The ward is broken. Climb to the mainmast.":"결계가 부서졌다. 주 돛대까지 올라가라.","One down. The other half's still going — hear it?":"하나 끝. 나머지 절반은 아직 돌고 있어— 들려?","Along the rail, the pilgrims' luggage is still strapped down. Name-tags. A child's mitten. A letter, folded small, the ink gone blue with rain.":"난간을 따라, 순례자들의 짐이 아직 묶여 있다. 이름표. 아이의 벙어리장갑. 작게 접힌 편지, 잉크가 비에 젖어 푸르게 번졌다.","They came to watch. Because of what I did.":"저들은 구경하러 온 거야. 내가 한 일 때문에.","Because of what *he* did.":"*그자가* 한 일 때문에.","I gave him the stone, Corvin. I climbed into the light and took it out with my own hands.":"내가 그에게 돌을 줬어, 코르빈. 내가 빛 속으로 올라가 내 손으로 꺼냈어.","...Yeah. And I had a ship.":"…그래. 그리고 나에겐 배가 있었지.","What?":"뭐?","When the sea went up, the Halcyon was in the air. Engines hot. Close enough to see the light on your mother's tower.":"바다가 솟아오를 때, 할시온은 하늘에 있었어. 엔진은 뜨거웠고. 네 어머니의 탑 위 빛이 보일 만큼 가까웠지.","I could have come back for you. I did the arithmetic. And I turned her east.":"너를 데리러 돌아갈 수 있었어. 계산은 해 봤어. 그리고 배를 동쪽으로 돌렸지.","Guilt's a bar tab, sparrow. You can drink on it forever, and it never gets any smaller.":"죄책감은 외상 장부야, 참새야. 평생 그걸로 마셔도, 줄어들지 않아.","Or?":"아니면?","Or nothing. That's as far as I ever got.":"아니면 없어. 내가 도달한 데까지가 거기야.","Figured you might work out the rest. You were always the one reading.":"나머지는 네가 알아낼 줄 알았어. 넌 늘 읽는 쪽이었으니까.","Or you pay it down. One piece at a time. And you don't get to stop.":"아니면 갚아 가는 거지. 한 조각씩. 그리고 멈출 수는 없어.","Corvin told me he could have come back for us when the sea went up. He did the arithmetic and turned east. He says guilt is a bar tab. I think he wants me to tell him what comes after \"or\".":"코르빈이 바다가 솟아올랐을 때 우리를 데리러 올 수 있었다고 했다. 계산을 해 보고 동쪽으로 돌렸다고. 죄책감은 외상 장부래. \"아니면\" 다음에 뭐가 오는지 내가 알려 주기를 바라는 것 같다.","The torn mainsail is not a sail. It opens. It has eyes.":"찢어진 주 돛은 돛이 아니다. 펼쳐진다. 눈이 있다.","Squall drake. They nest in storms. This one's been nesting in a hymn.":"폭풍 비룡. 폭풍에 둥지를 틀지. 이 녀석은 찬송가에 둥지를 틀고 있었어.","Is that bad?":"그거 나쁜 거야?","It's been eating lightning for a year, kid. Everything's bad.":"일 년 동안 번개를 먹었어, 꼬마. 뭐든 나쁘지.","Squallmaw falls into the rigging and is still. The wind lets go of the ship.":"폭풍아귀가 삭구 속으로 떨어져 움직이지 않는다. 바람이 배를 놓아 준다.","For the first time in a year, the rain falls _down_.":"일 년 만에 처음으로, 비가 _아래로_ 내린다.","Tangled in the mainmast hangs a lift-sail of gray stormsilk, scorched at one corner and otherwise whole.":"주 돛대에 엉켜 회색 폭풍비단 승력 돛이 걸려 있다, 한쪽 끝이 그을렸을 뿐 나머지는 온전하다.","And through a tear in the clouds — far to the north, on a shard brighter than anything left in the sky — stands a needle of white light.":"그리고 구름이 갈라진 틈으로— 아주 멀리 북쪽, 하늘에 남은 무엇보다 밝은 바위 조각 위에— 하얀 빛의 바늘이 서 있다.","That wasn't there last year.":"작년엔 저게 없었어.","It's standing on the biggest shard. Right where the sun broke.":"가장 큰 바위 조각 위에 서 있어. 태양이 갈라진 바로 그 자리에.","...It looks like noon over there.":"…저긴 정오처럼 보이는데.","It's not noon anywhere. It hasn't been noon for a year.":"어디도 정오가 아니야. 일 년째 정오인 곳은 없어.","I know.":"알아.","Take the stormsilk back to the Roost. Ruddock's barge waits at the south pier.":"폭풍비단을 둥지로 가져가라. 러독의 바지선이 남쪽 부두에서 기다린다.","We killed the storm drake. The rain fell down. Far away, on the biggest shard of the sun, there's a white tower that looks like noon. Two parts.":"우리가 폭풍 비룡을 죽였다. 비가 아래로 내렸다. 멀리, 태양의 가장 큰 바위 조각 위에, 정오처럼 보이는 하얀 탑이 있다. 둘 끝.","The captain's log, swollen with rain. The last pages are legible.":"선장 일지가 비에 불어 퉁퉁해졌다. 마지막 페이지는 읽을 수 있다.","\"Day of the Vespersong. Pilgrims in high spirits. The Hierophant will sing the sun to sleep tonight, and it will never set on us again. The Abbess asks if we may circle the Cathedral twice for the view.\"":"\"저녁성가의 날. 순례자들 기분이 좋다. 오늘 밤 교황께서 태양을 노래로 잠재우시면, 우리 위로 다시는 해가 지지 않으리라. 수녀원장님이 경치를 보려면 대성당을 두 바퀴 돌 수 있냐고 묻는다.\"","\"Later. The sun is wrong. The sun is—\"":"\"그 후. 태양이 이상하다. 태양이—\"","The rest is water.":"나머지는 물이다.","The Cinderdeep, darling. Ruddock knows the way. Try not to die on my property; it does terrible things to the price of land.":"잿더미 광산이란다, 자기. 러독이 길을 알아. 내 땅에서 죽지는 마; 땅값에 아주 나쁜 영향을 주거든.","The Long Bell is close. I can feel it in my ledgers.":"긴 종이 가까워. 내 장부에서 느껴져.","Go and finish your ship. I'll be along to see what it's worth.":"가서 배나 마무리해. 값이 얼마인지 보러 갈 테니.","The Keeper's girl and her keeper. Sit. Don't touch the ledgers; they bite.":"수호자의 딸과 그 수호자. 앉아. 장부는 만지지 마; 물어.","You want into my mine. Everyone wants into my mine. It's the only warm place left in the world.":"내 광산에 들어가고 싶은 거지. 다들 그러지. 세상에 남은 유일하게 따뜻한 곳이니까.","My miners stopped coming up two Bells ago. The ones who did come up talk about a worm made of light, coiled round the biggest ember we ever dug. It's eating my embers. And three of my debtors.":"내 광부들이 두 종 전부터 올라오지 않아. 올라온 자들은 빛으로 된 벌레가 우리가 캔 가장 큰 불씨를 감고 있다고 해. 그게 내 불씨를 먹고 있어. 그리고 내 채무자 셋도.","We'll kill it.":"우리가 죽일게.","I adore a girl who skips the negotiation.":"협상을 건너뛰는 여자라니 마음에 들어.","Kill it, and take one heart-ember for your ship. Bring my three debtors out alive, and I shall be... grateful. I'm told it's a pleasant feeling.":"죽이고, 배에 쓸 심장불씨 하나를 가져가. 내 채무자 셋을 살려 데려오면, 나는… 고마워하겠어. 기분 좋은 감정이라고 들었어.","Down in the Deep":"깊은 곳으로","Odessa's three missing miners — Dagny, Hobb and Ines — are somewhere in the Cinderdeep. Bring them out alive.":"오데사의 실종 광부 셋— 다그니, 홉, 이네스—는 잿더미 광산 어딘가에 있다. 살려서 데려와라.","Now. Children, out. I need a word with the Captain. Adult business.":"자. 아이들은 나가. 선장과 할 말이 있어. 어른들 얘기야.","I'm *twelve*.":"난 *열두 살* 이라고.","Then you're very nearly a third of the way there.":"그럼 거의 삼분의 일쯤은 왔네.","The Choir came calling, darling. A knight-captain in a white ship. Very polite. Very *armed*.":"성가대가 찾아왔어, 자기. 하얀 배를 탄 기사 대장. 아주 예의 바르게. 아주 *무장을 하고*.","They want the sparrow.":"그들은 참새를 원해.","They want the Keeper's daughter, alive and unbruised. The Hierophant misses her, apparently. They'll pay enough to clear your marker four times over.":"수호자의 딸을 원해, 살아 있고 멍 없이. 교황께서 그 아이를 그리워하신다더군. 자네 어음을 네 번이나 탕감할 만큼 값을 치를 거야.","And you said...":"그래서 뭐라고 했어?","I said I'd think about it. I'm thinking about it, darling. Are you?":"생각해 보겠다고 했지. 생각 중이야, 자기. 너도 그래?","...I'm always thinking. It's the doing I'm bad at.":"…난 늘 생각 중이야. 나는 하는 쪽이 서툴러서.","Your little skiff's still fueled, I notice. Moored at the Lip. Pointed at open sky.":"네 소형 배엔 아직 연료가 있더라. 입술에 정박해 있고. 활짝 트인 하늘을 향해.","You always keep a door open, Corvin. It's the most honest thing about you.":"넌 늘 문 하나는 열어 두지, 코르빈. 그게 네 가장 정직한 점이야.","Is that all?":"그게 다야?","That's all. Mind the step on your way out. People trip on it. It's how I like them.":"그게 다야. 나갈 때 발밑 조심해. 사람들이 거기서 걸려 넘어져. 난 그게 좋아.","What'd she want?":"그 여자가 뭘 원했어?","To tell me I'm handsome. She does it every Bell. It's in my contract.":"내가 잘생겼다고 알려 주겠다는 거야. 종이 울릴 때마다 그래. 계약에 있어.","You're lying. Your left hand does a thing when you're lying.":"거짓말이고. 거짓말할 때 네 왼손이 그러잖아.","...Who taught you that?":"…그걸 누가 가르쳐 줬어?","You did.":"너.","Ride the Toll Barge to the Cinderdeep. Find the heart-ember — and Odessa's three missing miners.":"통행 바지선을 타고 잿더미 광산으로 가라. 심장불씨를 찾고— 오데사의 실종 광부 셋도 찾아라.","Odessa gave us a permit for her mine. Then she sent us out and kept Corvin. He came out smiling. Pip didn't believe the smile. Neither did I.":"오데사가 광산 허가를 줬다. 그러고는 우리만 내보내고 코르빈은 붙잡아 뒀다. 그는 웃으며 나왔다. 핍은 그 미소를 믿지 않았다. 나도 마찬가지다.","Heat rolls up the shaft like breath. Somewhere far below, something breathes back.":"수직갱에서 열기가 숨결처럼 올라온다. 아주 아래 어디선가 무언가가 숨을 들이쉰다.","Why is it always *down*? Why is the worst thing never at the top of a nice hill?":"왜 항상 *아래* 야? 왜 최악의 것만 좋은 언덕 꼭대기에 없을까?","Because people who build on hills charge rent.":"언덕에 짓는 사람들은 임대료를 받거든.","Odessa's miners will be in the side-galleries if they're anywhere. Keep your eyes open.":"오데사의 광부들은 있으면 측면 통로에 있을 거야. 눈 크게 뜨고 있어.","The valve is open. Steam whistles through the pipes, thin and steady.":"밸브가 열려 있다. 증기가 배관으로 새어 나간다, 가늘고 고르게.","A steam valve, its wheel crusted with slag. The pipe runs off into the dark toward the deep galleries.":"증기 밸브. 손잡이에 슬래그가 엉겨 붙었다. 관은 어둠 속 깊은 통로 쪽으로 뻗어 있다.","Steam screams through the pipes. Far to the east, a river of slag hisses, cools, and cracks into rubble.":"증기가 배관에서 비명처럼 쏟아진다. 멀리 동쪽에서 슬래그 강물이 쉬익 하며 식고, 갈라져 잔해가 된다.","Steam roars up a shaft to the north. Somewhere above, molten slag goes gray and breaks apart.":"증기가 북쪽 수직갱으로 포효하며 솟는다. 위 어딘가에서 녹은 슬래그가 재빛이 되어 부서진다.","All three miners are on their way out. Tell Odessa.":"광부 셋이 모두 나오는 길이다. 오데사에게 알려라.","Dagny. Hobb. Ines. All three, walking into my Roost on their own legs, smelling of brimstone and gratitude.":"다그니. 홉. 이네스. 셋 모두, 제 다리로 내 둥지에 걸어 들어온다, 유황과 고마움 냄새를 풍기며.","I said I'd be grateful. Here is the strange part: I am. Name your price, little Keeper.":"고맙겠다고 했지. 이상한 점은 말이야: 정말 고맙군. 값을 불러라, 어린 수호자.","Forgive their debts.":"그들의 빚을 없애 줘.","Five thousand gold.":"금화 오천 닢이야.","...Their debts.":"…그들의 빚.","You walked out of my mine with a fortune in your pocket, and you spend it on three people who can't even thank you properly.":"내 광산에서 재산을 들고 나왔으면서, 그걸 제대로 고맙다고 말할 줄도 모르는 셋에게 다 쓴다고.","Odessa takes three pages out of the Ledger. She looks at them for a long moment. Then she feeds them, one by one, to the lamp.":"오데사가 장부에서 페이지 세 장을 뜯는다. 한참 동안 들여다본다. 그러고는 하나씩, 램프 불에 태운다.","Don't tell anyone. I have a reputation.":"아무한테도 말하지 마. 내 평판이 있어."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch9c.json
          cat > i18n/parts/ch9d.json <<'KJSON'
          {"Ines asked me to give you this. Her girl made it. It's hideous. I'm told it's lucky.":"이네스가 너한테 주라고 했어. 그 여자 딸이 만든 거야. 끔찍해. 행운이 있다더군.","Gold. Sensible. I could almost love you.":"금화. 현실적이네. 거의 사랑할 뻔했어.","The chamber is bright as noon. At its center lies a well of molten light — and coiled around it, drinking, a worm the length of a street, its scales like stained glass with the sun behind them.":"방은 정오처럼 밝다. 한가운데엔 녹은 빛의 우물이 있고— 그 주위를 감아, 마시고 있는 것은, 거리만 한 길이의 벌레, 그 비늘은 등 뒤의 태양을 비춘 스테인드글라스 같다.","Well. That's the biggest ember I ever saw.":"뭐. 내가 본 불씨 중 제일 크군.","It's *eating* it.":"저게 *먹고* 있어.","It's eating the sun.":"태양을 먹고 있어.","Then it can learn to share.":"그럼 나눠 먹는 법을 배우겠지.","The Sunworm uncoils, slow as a sunset, and goes dark. The well of light settles. At its bottom, cooling from white to gold, sits an ember the size of a heart.":"태양벌레가 노을처럼 느리게 몸을 풀고, 어두워진다. 빛의 우물이 가라앉는다. 그 바닥에서 흰빛이 금빛으로 식어 가며 심장만 한 불씨가 놓인다.","Mags is gonna cry.":"맥스가 울겠는데.","I might cry.":"나도 울지도.","You cry at bread, tin-can.":"넌 빵만 봐도 울잖아, 양철깡통.","Bread is *moving*.":"빵이 *움직이는데*.","...Sable used to say that. About bread. That it was warm, and she didn't know food could be warm.":"…세이블이 그런 말을 했었지. 빵에 대해서. 따뜻하다고, 음식이 따뜻할 수 있는 줄 몰랐다고.","She still says it. Somewhere. She has to.":"그 여자는 아직도 그러겠지. 어딘가에서. 그래야만 해.","Take the heart-ember back to the Halcyon. Mags is waiting.":"심장불씨를 할시온으로 가져가라. 맥스가 기다린다.","Three parts. The heart is gold and still warm. Bram said Sable's line about bread, and nobody could say anything for a while.":"세 부품. 심장은 금빛이고 아직 따뜻하다. 브람이 빵에 대한 세이블의 말을 했고, 한동안 아무도 아무 말도 못 했다.","Coil. Sail. Heart.":"코일. 돛. 심장.","Mags takes the three parts up the plank as tenderly as if they were newborns.":"맥스가 세 부품을 새로 태어난 것처럼 다정하게 널빤지 위로 가지고 올라간다.","Give me the time it takes to swear properly, and she'll fly.":"제대로 욕을 할 시간만 주면, 저건 날아. ","Mags swears properly. It takes about an hour. Some of it is in languages that no longer have countries.":"맥스가 제대로 욕을 한다. 한 시간쯤 걸린다. 일부는 이제 나라가 없는 언어로 한다.","Across the Roost, the Long Bell tolls. There is no sun to mark the days anymore, so the Roost rings a bell and agrees to believe it.":"둥지 너머로 긴 종이 울린다. 이제 날을 알려 줄 해도 없으니, 둥지는 종을 울리고 그것을 믿기로 합의한다.","The Long Bell, darling. I've come for my ship.":"긴 종이야, 자기. 내 배를 가지러 왔어.","Your ship's about to leave, Quill.":"네 배는 곧 떠나, 퀼.","Then I'm just in time.":"그럼 딱 맞게 왔네.","A shadow falls across the canyon. Something white and enormous blots out the sky — a warship, its hull painted with the Choir's golden sunburst, lowering itself between the walls on singing engines.":"협곡 위로 그림자가 드리운다. 하얗고 거대한 무언가가 하늘을 가린다— 군함, 선체에 성가대의 금빛 태양 문양이 그려져 있고, 노래하는 엔진으로 벽 사이를 내려온다.","That's the *Steadfast*. They used to show it to the squires. To make us proud.":"저건 *스테드패스트* 야. 예전엔 종자들에게 보여 줬어. 우리를 자랑스럽게 만들려고.","By order of the Hierophant: Wren Halloway, the Keeper's daughter. Unharmed.":"교황의 명령에 따라: 렌 할러웨이, 수호자의 딸. 다치지 않은 채로.","The rest of you are... optional.":"나머지 너희는… 선택 사항이다.","Ashe. Corvin Ashe. They still teach you at the academy, you know. In the lecture on desertion.":"애시. 코르빈 애시. 아카데미에서 아직도 너를 가르친다, 알지. 탈영에 관한 강의에서.","Sev. You got old.":"세브. 늙었네.","You got *drunk*.":"*취했* 지.","And Kestrel. The squire who froze. Aldous Venn died so you could run away — and here you are, running with a deserter. How fitting.":"그리고 케스트럴. 얼어붙은 종자. 알두스 벤이 너 대신 죽었는데— 여기 와서 탈영병과 함께 달아나고 있군. 딱 맞는 꼴이야.","...I'm not running, Captain.":"…달아나는 거 아니에요, 대장.","We'll see.":"두고 보지.","_(quietly)_ Your skiff's at the Lip, darling. Fueled. Pointed at open sky.":"_(조용히)_ 네 소형 배는 입술에 있어, 자기. 연료도 있고. 활짝 트인 하늘을 향해.","_(quietly)_ Go now, and I'll burn your marker myself. Nobody would blame you. Nobody ever expected anything else.":"_(조용히)_ 지금 가면 네 어음은 내가 태워 줄게. 아무도 탓하지 않아. 아무도 다른 걸 기대한 적도 없고.","At the canyon's lip, Corvin's skiff rocks on its mooring line. Small. Fast. Pointed at nothing at all.":"협곡 끝에서 코르빈의 소형 배가 계류줄에 흔들린다. 작다. 빠르다. 아무것도 향하지 않는다.","...Go on, then.":"…가 봐.","_(quietly)_ You're good at it.":"_(조용히)_ 넌 그걸 잘하니까.","Yeah.":"그래.","I am.":"그래.","Corvin draws, turns, and fires — once — down the whole length of the canyon.":"코르빈이 총을 뽑고, 돌고, 발사한다— 한 발— 협곡 전체 길이를 따라.","At the Lip, the skiff's mooring line parts. The little boat tips, slides, and drops into the dark without a sound.":"입술에서 소형 배의 계류줄이 끊어진다. 작은 배가 기울고, 미끄러지고, 아무 소리 없이 어둠 속으로 떨어진다.","Huh.":"허.","Always wondered what that would feel like.":"늘 어떤 느낌일지 궁금했어.","How's it feel?":"어때?","Terrible. Get behind me, kid.":"끔찍해. 내 뒤로 와, 꼬마.","Something in Corvin's Crest turns over, like a card laid face-up on the table.":"코르빈의 크레스트 안에서 무언가 뒤집힌다, 탁자 위에 카드를 앞면으로 내려놓은 것처럼.","Sev. Let's play a hand. You win, you get the sparrow. I win, you go home and tell the Hierophant Corvin Ashe says hello.":"세브. 한 판 해. 네가 이기면 참새를 데려가. 내가 이기면 넌 집에 가서 교황께 코르빈 애시가 안부를 전한다고 해.","I don't gamble, deserter.":"난 도박 안 해, 탈영병.","Everybody gambles, Sev. Only some of us admit it.":"모두 도박해, 세브. 인정하는 사람만 적을 뿐이지.","Marines. Take the girl.":"해병들. 소녀를 데려가라.","This isn't... over, Ashe.":"이건… 끝난 게 아니야, 애시.","Nothing ever is, Sev. That's the trouble with things.":"아무것도 끝난 적 없어, 세브. 그게 문제라는 거지.","Steadfast! Lift!":"스테드패스트! 들어 올려!","The warship's engines scream. It claws its way up out of the canyon, scraping stone, and is gone. A sealed letter flutters down where the Knight-Captain stood.":"군함의 엔진이 비명을 지른다. 돌을 긁으며 협곡을 박차고 올라가고, 사라진다. 기사 대장이 서 있던 자리에 봉인된 편지가 흩날려 내려온다.","Her orders. That's not the Hierophant's seal...":"그 여자의 명령서야. 이건 교황의 인장이 아니라…","\"Bring the Keeper's daughter to the Noon Spire, unharmed. The vessel grows restless, and asks for her by name. — M.\"":"\"수호자의 딸을 정오 첨탑으로 데려오라, 다치지 않게. 배가 안절부절못하며, 그 아이를 이름으로 부른다. — M.\"","\"M.\" Mercy.":"\"M.\" 머시.","The vessel...":"배가…","Sable. That's *Sable*. She's alive!":"세이블. *세이블* 이야. 살아 있어!","...And she's asking for me.":"…그리고 나를 찾고 있어.","The Noon Spire. It stands on the greatest shard, where the sun broke. The Choir ferries supplies in every Bell. Everyone who goes in comes out smiling.":"정오 첨탑. 가장 큰 바위 조각 위에 서 있어, 태양이 갈라진 자리에. 성가대가 종이 울릴 때마다 보급품을 실어 나르지. 들어간 사람은 다 웃으며 나와.","That's what frightens me.":"그게 날 무섭게 해.","You sold us out, Quill.":"우리를 팔았어, 퀼.","I never told the Choir a thing, darling. Severine found you all on her own; she's very thorough.":"난 성가대에 아무것도 말하지 않았어, 자기. 세브린이 혼자 너희를 찾았지. 그 여자는 아주 철저해.","I only wanted to see what you'd do with an open door.":"난 그저 네가 열린 문으로 뭘 하는지 보고 싶었을 뿐이야.","Odessa opens her ledger to a page near the back, worn soft with handling. She tears it out.":"오데사가 장부를 뒤쪽 페이지로 펼친다, 손때로 무두질된 페이지다. 그걸 찢어 낸다.","Fifty-one thousand, four hundred gold. Paid in full.":"오만 천사백 금화. 전액 상환.","Paid with what?":"뭘로 갚았는데?","With the look on your face when that skiff went over. I've held your marker nine years, waiting to see it.":"저 소형 배가 넘어갈 때 네 얼굴을 보고 갚았어. 아홉 해 동안 네 어음을 들고 있었지, 그걸 보려고.","Don't make me regret the investment. Regret is terrible for business.":"날 후회하게 만들지 마. 후회는 장사에 아주 나빠.","...You're a terrible woman.":"…당신 정말 못된 여자야.","I'm a *banker*.":"난 *은행가* 란다.","CAPTAIN! Are we flying, or are we *chatting*?":"선장! 우리 나는 거야, 아니면 *수다* 떠는 거야?","Mags.":"맥스.","Take her up.":"띄워.","The Halcyon rises out of Corvin's Roost like a held breath let go.":"할시온이 코르빈의 둥지에서, 참았던 숨을 내쉬듯 떠오른다.","Below, the canyon shrinks to a crack, then a line, then nothing at all. Above, the bruised sky opens its arms.":"아래에서 협곡은 틈으로 줄고, 선이 되고, 아무것도 아니게 된다. 위에서 멍든 하늘이 두 팔을 벌린다.","Coil's singing. Sail's full. Heart's burning hot as a scandal.":"코일이 노래해. 돛은 가득하고. 심장은 추문처럼 뜨겁게 타고 있어.","She's flying, Captain.":"날고 있어, 선장.","_(quietly)_ She's flying.":"_(조용히)_ 날고 있어.","Kid. C'mere.":"꼬마. 이리 와.","Both hands. She doesn't like being held loose.":"두 손으로. 느슨하게 잡으면 싫어하거든.","Like this?":"이렇게?","Like that. Feel her pull? She wants to go up. Everything does. You just let her, a little at a time.":"그렇게. 당기는 게 느껴져? 올라가고 싶어 해. 모든 게 그러지. 조금씩, 그냥 놓아 주면 돼.","I'M FLYING. I'M FLYING THE—":"나는 중이야. 나는 중이—","Ahem. I mean. It's fine. It's basically a boat.":"흠. 그러니까. 괜찮아. 거의 배잖아.","He's beaming. Look at him. He's *beaming*.":"얼굴이 환해. 저거 봐. *환해*.","He's twelve.":"얼굴이 열두 살이야.","Wren laughs. It surprises her. It is the first time in a year.":"렌이 웃는다. 스스로도 놀란다. 일 년 만에 처음이다.","Hey. Sparrow.":"이봐. 참새야.","Found the \"or\".":"\"아니면\"을 찾았어.","Yeah?":"그래?","You pay it down. A bit at a time. And you don't get to stop.":"조금씩 갚아 나가. 그리고 멈출 수는 없어.","...I know.":"…알아.","Figured you did. Took me nine years and a skiff.":"알 거라 생각했어. 내겐 아홉 해하고 소형 배 하나가 걸렸지.","Mags. Set a course for the Noon Spire.":"맥스. 정오 첨탑으로 침로를 잡아.","The sparrow's giving orders on my deck now?":"이제 참새가 내 갑판에서 명령을 하네?","Captain?":"선장님?","...You heard her, Mags.":"…들은 대로 해, 맥스.","Course for the big shiny tower of certain death. Aye aye.":"확실한 죽음이 있는 저 크고 반짝이는 탑으로. 알겠습니다.","And you, kid — if you're going to stand at my wheel, you'll want these.":"그리고 너, 꼬마— 내 조타륜에 설 거라면, 이걸 차고 있어야 할 거야.","They're too big.":"너무 커.","You'll grow.":"크면 맞겠지.","The Halcyon flies. Corvin let Pip take the wheel. I laughed — I'd forgotten how. Sable is in the Noon Spire, and she's asking for me. We're coming.":"할시온이 난다. 코르빈이 핍에게 조타륜을 맡겼다. 나는 웃었다— 어떻게 웃는지 잊고 있었는데. 세이블은 정오 첨탑에 있고, 나를 찾고 있다. 우리가 간다.","Find Sable in the Noon Spire.":"정오 첨탑에서 세이블을 찾아라."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch9d.json
          git add i18n/parts/ch9c.json i18n/parts/ch9d.json
          git commit -m "ko: 9장 2/3(해골밭·베네딕션·폭풍)"
          git push origin HEAD:main
