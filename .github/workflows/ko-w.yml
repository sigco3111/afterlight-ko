name: ko-w
on:
  workflow_dispatch:
    inputs:
      file:
        description: part file name
        required: true
      msg:
        description: commit message
        required: true
      payload:
        description: json payload
        required: true
permissions:
  contents: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write and push
        run: |
          mkdir -p i18n/parts
          cat > "i18n/parts/${{ inputs.file }}" <<'KOEOF'
          ${{ inputs.payload }}
          KOEOF
          node -e "JSON.parse(require('fs').readFileSync('i18n/parts/${{ inputs.file }}','utf8')); console.log('json ok')"
          git config user.name "sigco3111"
          git config user.email "sigco3111k@gmail.com"
          git add i18n/parts
          git commit -m "${{ inputs.msg }}"
          git push
