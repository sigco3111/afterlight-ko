name: ko-put-names
on:
  push:
    paths:
      - '.github/workflows/ko-put-names.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write part
        run: |
          mkdir -p i18n/parts
          echo '' | base64 -d > i18n/parts/names.json
          node tools/merge-ko.mjs
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'i18n: 아이템·상태·크레스트 이름 및 메뉴 문자열(parts/names.json)'
          git push
