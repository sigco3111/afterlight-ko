name: ko6-tmp2
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ -f go/CLEANUP ]; then echo "mode=cleanup" >> "$GITHUB_OUTPUT"; else echo "mode=probe" >> "$GITHUB_OUTPUT"; fi
      - name: 정리
        if: steps.mode.outputs.mode == 'cleanup'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f go
          git rm -f .github/workflows/ko6-tmp.yml .github/workflows/ko6-tmp2.yml || true
          git commit -m '정리: 6차 임시 러너 워크플로·스크립트 삭제 [skip ci]'
          git push origin HEAD:refs/heads/main || echo 'push failed'
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'probe'
        with:
          node-version: 20
      - name: 사전 병합
        if: steps.mode.outputs.mode == 'probe'
        run: node tools/merge-ko.mjs
      - name: 의존성 설치
        if: steps.mode.outputs.mode == 'probe'
        run: npm install --no-audit --no-fund
      - name: 빌드
        if: steps.mode.outputs.mode == 'probe'
        run: npx vite build --base=./
      - name: Playwright 설치
        if: steps.mode.outputs.mode == 'probe'
        run: |
          npm i -D playwright@1.48.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 프로브 실행
        if: steps.mode.outputs.mode == 'probe'
        run: node go/probe.mjs || echo 'probe failed'
      - name: 결과 커밋
        if: steps.mode.outputs.mode == 'probe'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f go/out
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'i18n: 6차 러너 결과 반영 [skip ci]'; git push origin HEAD:refs/heads/main || echo 'push failed'; fi
