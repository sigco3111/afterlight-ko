name: ko6-tmp
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 사전 병합
        run: node tools/merge-ko.mjs
      - name: 의존성 설치
        run: npm install --no-audit --no-fund
      - name: 빌드
        run: npx vite build --base=./
      - name: Playwright 설치
        run: |
          npm i -D playwright@1.48.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 프로브 실행
        run: node go/probe.mjs || echo 'probe failed'
      - name: 결과 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f go/out
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'i18n: 6차 러너 결과 반영 [skip ci]'; git push; fi
