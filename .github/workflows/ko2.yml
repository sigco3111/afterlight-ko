name: ko2
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/ko2.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 러너 실행
        run: node go/ko2/run.mjs
