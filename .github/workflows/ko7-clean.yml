name: ko7-clean
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ko7-clean.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 삭제
        run: |
          git rm -r --ignore-unmatch go
          git rm -f --ignore-unmatch .github/workflows/ko7-tmp.yml .github/workflows/ko7-scan2.yml .github/workflows/ko7-scan3.yml .github/workflows/ko7-clean.yml
      - name: 커밋
        run: |
          git config user.name "ko7-bot"
          git config user.email "ko7-bot@users.noreply.github.com"
          git commit -m "정리: 7차 임시 러너 워크플로·스캔 산출물 삭제"
          git push
