name: go-run
on:
  push:
    paths:
      - 'go/**'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 실행
        run: node tools/go-run.mjs
      - name: 커밋
        run: |
          git config user.name "go-bot"
          git config user.email "go-bot@users.noreply.github.com"
          git add tmp
          git commit -m "go: 임시 산출물" || echo "변경 없음"
          git push
