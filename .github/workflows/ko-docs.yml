name: ko-docs
on:
  push:
    paths:
      - '.github/workflows/ko-docs.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write docs
        run: |
          [ -f README.en.md ] || git mv README.md README.en.md
          mkdir -p docs
          echo '' | base64 -d > README.md
          echo '' | base64 -d > docs/glossary.md
          rm -f .github/workflows/ko-ops.yml .github/workflows/ko-test.yml .github/workflows/ko-part-items.yml .github/workflows/ko-put-ch1a.yml .github/workflows/ko-put-ch1b.yml .github/workflows/ko-put-items.yml .github/workflows/ko-put-ui.yml .github/workflows/ko-put-ui2.yml .github/workflows/ko-put-names.yml
          node tools/merge-ko.mjs
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m '문서: 한국어 README·용어집 추가, 원작 README 보존, 임시 워크플로 정리'
          git push
