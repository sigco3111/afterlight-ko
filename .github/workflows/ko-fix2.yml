name: ko-fix2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fix names
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          echo '' | base64 -d > /tmp/fix2.py
          python3 /tmp/fix2.py
          git add i18n/parts/ch9d.json i18n/parts/ch89-names.json i18n/parts/ch8c.json
          git commit -m "ko: 9장 매그스 표기 통일"
          git push origin HEAD:main
