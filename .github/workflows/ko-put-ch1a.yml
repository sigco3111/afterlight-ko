name: ko-put-ch1a
on:
  push:
    paths:
      - '.github/workflows/ko-put-ch1a.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write part
        run: |
          mkdir -p i18n/parts
          echo '' | base64 -d > i18n/parts/ch1a.json
          node tools/merge-ko.mjs
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'i18n: 1장 대사 사전 1/2(parts/ch1a.json)'
          git push
