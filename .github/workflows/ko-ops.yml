name: ko-ops
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'shell command'
        required: true
      msg:
        description: 'commit message'
        required: false
        default: 'chore: ops'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: run
        run: |
          set -euo pipefail
          bash -c "${{ inputs.cmd }}"
      - name: commit
        if: always()
        run: |
          git config user.name 'afterlight-ko'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "${{ inputs.msg }}"
          git push
