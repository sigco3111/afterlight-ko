name: ko-dump2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/d2.mjs <<'JS'
          import fs from 'node:fs'; import path from 'node:path';
          const out=[];
          const walk=(o)=>{ if(typeof o==='string'){out.push(o);return;} if(!o||typeof o!=='object')return; if(Array.isArray(o)){o.forEach(walk);return;} for(const v of Object.values(o)) walk(v); };
          try{ const m=await import(path.resolve('src/data/tutorials.js')); for(const v of Object.values(m)) walk(v); }catch(e){ out.push('ERR '+e.message); }
          const names=[];
          const files=[];
          const scan=(d)=>{ for(const f of fs.readdirSync(d)){ const p=d+'/'+f; const st=fs.statSync(p); if(st.isDirectory()) scan(p); else if(/\.(js|json)$/.test(f)) files.push(p); } };
          try{ scan('src/data/maps'); }catch(e){ names.push('ERR '+e.message); }
          try{ scan('src/world'); }catch(e){}
          for(const p of files){ const t=fs.readFileSync(p,'utf8'); for(const m of t.matchAll(/(?:name|label|title|region|area)\s*:\s*'([^']{2,60})'/g)) names.push(p.replace('src/','')+' :: '+m[1]); }
          const write=(tag,arr)=>{ fs.mkdirSync('docs/_dump',{recursive:true}); let md='# '+tag+' ('+arr.length+')\n',n=0,part=1; arr.forEach((s,i)=>{ const t=String(s); for(let j=0;j<t.length;j+=120){ md+='- '+tag+'.'+i+'.'+(j/120)+' '+t.slice(j,j+120).replace(/\n/g,' ')+'\n'; n++; if(n>150){ fs.writeFileSync('docs/_dump/'+tag+'-'+part+'.md',md); md='# '+tag+' p'+(part+1)+'\n'; n=0; part++; } } }); fs.writeFileSync('docs/_dump/'+tag+'-'+part+'.md',md); };
          write('tut',out);
          write('maps',names);
          console.log('ok',out.length,names.length);
          JS
          node /tmp/d2.mjs
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add -A
          git commit -m "작업: 튜토리얼·맵 이름 덤프" || true
          git push
