name: en-dump
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf tmp/en; mkdir -p tmp/en
          for f in ch3_side ch4a_mountain ch4b_sky ch4b_verdance ch5; do
            split -b 8000 -d -a 2 "src/story/$f.js" "tmp/en/$f."
          done
          ls tmp/en | wc -l
      - run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git checkout -b endump
          git add -A tmp/en
          git commit -m "dump: en chunks (temp branch)"
          git push -f origin endump
