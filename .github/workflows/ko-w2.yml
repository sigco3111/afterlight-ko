name: ko-w2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write parts
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          cat > i18n/parts/ch8c.json <<'KJSON'
          {"Baron Dask won't help — \"children are a cost.\" Bram knew what the Penitent looks like before anyone told him. He went gray. He's \"off duty at midnight.\"":"다스크 남작은 돕지 않는다— \"아이는 비용\"이라니까. 브람은 누가 말해 주기 전부터 참회자가 어떻게 생겼는지 알고 있었다. 얼굴이 재빛이 됐다. 그는 \"자정에 근무가 끝\"난다.","Kites are on the lines. Slingshots, whistles, and every pot in the Nest for banging. We'll hear 'em coming.":"연들이 줄 위에 올랐다. 새총, 호루라기, 그리고 둥지의 모든 냄비를 두드릴 준비. 오는 소리는 들을 거야.","Don't take long. Night comes when it wants now.":"오래 걸리지 마. 이젠 밤이 오고 싶을 때 와.","Go on, sleep. I'll take first watch. I always take first watch.":"가서 자. 첫 경비는 내가 설게. 늘 첫 경비는 나야.","A whistle. Then twenty whistles. Then every pot in Kiteholm, banging at once.":"호루라기 하나. 그리고 스무 개. 그리고 카이트홀름의 모든 냄비가 한꺼번에 울린다.","_(from the kite-lines)_ EAST CLIFF! BLACK SAILS ON THE EAST CLIFF!":"_(연줄 위에서)_ 동쪽 벼랑! 동쪽 벼랑에 검은 돛이다!","A black sky-barge noses out of the haze, sails like torn mourning-cloth. Figures drop from it on ropes onto the Kite Cliffs.":"검은 하늘 바지선이 안개 속에서 비집고 나온다, 돛은 찢어진 상복 천 같다. 밧줄을 타고 연 벼랑 위로 사람들이 내려선다.","Kites! Positions! Littles in the Nest, bigs on the lines! _GO!_":"연들! 제자리! 작은 것들은 둥지에, 큰 것들은 줄 위에! _가!_","More — by the market! Those aren't men. Look at them. They're _empty_.":"더 있어— 시장 쪽에도! 저건 사람이 아냐. 봐. 저것들은 _비어 있어_.","He comes down the Baron's ramp like a funeral bell: slow, heavy, certain. Black armor. A mask carved into a face that has been weeping for a very long time.":"그는 남작의 경사로를 종소리처럼 내려온다: 느리고, 무겁고, 확실하게. 검은 갑옷. 아주 오래 울어 온 얼굴을 깎아 만든 가면.","The children. Where are the children.":"아이들. 아이들은 어디 있나.","You're not taking them.":"데려가지 못해.","I am not _taking_ them. I am taking them _home_. To a summer afternoon that never ends. To mothers who never die. To birthdays.":"_데려가는_ 게 아니다. _집으로_ 데려가는 것이다. 끝나지 않는 여름 오후로. 죽지 않는 어머니에게. 생일로.","What do you offer them? This? Kites and ash?":"그쪽은 뭘 주지? 이걸? 연과 재를?","We offer them _knives_, you tin-plated—":"우린 _칼_ 을 주지, 이 양철—","Wren! Ilse! I— I heard the pots, I came as fast as—":"렌! 일세! 나— 냄비 소리 듣고, 되는 대로 뛰어왔—","The Penitent turns. Lifts his greatsword high over his right shoulder, point back, elbow up. Waits.":"참회자가 돌아선다. 큰 검을 오른쪽 어깨 위로 높이 들어 올린다, 검끝은 뒤로, 팔꿈치는 위로. 기다린다.","...That's the Venn Guard.":"…벤 가드야.","Nobody uses the Venn Guard. Nobody but— nobody but _him_.":"벤 가드는 아무도 안 써. 아무도— _그 사람_ 말고는.","Squire.":"종자.","Bram does not move. His sword is in his hand. His feet are on the planks. He does not move at all.":"브람은 움직이지 않는다. 검은 손에 있다. 발은 널빤지 위에 있다. 전혀 움직이지 않는다.","Bram! BRAM!":"브람! 브람!","You froze then, too. At your trial. Do you remember? I stepped in front of the blow.":"그때도 넌 얼어붙었지. 네 재판에서. 기억하나? 내가 그 일격 앞에 나섰다.","Nobody will step in front of this one.":"이번 일격 앞에 나설 사람은 없다.","B-Boss—":"두— 두목—","TANSY, DOWN—!":"탠지, 엎드려—!","The stroke comes down like the end of the world. Tansy is on the planks, unhurt, shoved clear. And a boy with one eye is lying where she was standing.":"일격이 세상의 끝처럼 내려온다. 탠지는 널빤지 위에, 다치지 않고, 밀려 나 있다. 그리고 눈이 하나인 소년이 그녀가 서 있던 자리에 누워 있다.","_PIP!_":"_핍!_","He's breathing. He's— Wren, I need _time_, I need him to stop _bleeding_—":"숨 쉬고 있어. 숨을— 렌, 난 _시간_ 이 필요해, 피가 _멈춰야_ 해—","...no.":"…아니야.","No. Not again.":"아니. 또 그러지 않아.","NOT AGAIN!":"또 그러지 않아!","Steel on steel. The Penitent's second stroke stops a hand's width from the children — on Bram's blade.":"쇠가 쇠를 친다. 참회자의 두 번째 일격이 아이들에게서 손바닥 하나 폭 앞에서— 브람의 검에 멈춘다.","I'm _afraid_. You hear me? I'm so afraid I can't feel my hands.":"나 _무서워_. 들려? 너무 무서워서 손이 안 느껴져.","I'm doing it anyway.":"그래도 한다.","The Penitent goes down on one knee. The weeping mask cracks clean in two, and falls, and rings on the planks.":"참회자가 한쪽 무릎을 꿇는다. 우는 가면이 정확히 둘로 갈라져 떨어지고, 널빤지 위에서 울린다.","Under it is the face of a man in his fifties. Gray beard, a broken nose healed crooked — a kind face. And the eyes are empty. Not dark. _Empty_, like the windows of a house where nobody lives.":"그 밑에는 오십 대 남자의 얼굴이 있다. 회색 수염, 비뚤게 아문 부러진 코— 선한 얼굴. 그리고 눈은 비어 있다. 어둡지 않다. _비었_ 다, 아무도 살지 않는 집의 창문처럼.","Sir... Sir Aldous?":"선생님… 알두스 경?","Squire Kestrel. You are late for your trial.":"케스트럴 종자. 재판 시간에 늦었다.","You died. You _died_. I saw you die. You stepped in front of—":"죽으셨잖아요. _죽으셨_ 다고요. 죽는 걸 봤어요. 그 일격 앞에 나서셨—","In the noon, I don't have to. The Hierophant gave me back the day before. I polish my armor. You bring me cider. You say you're ready. I say you're not. Over. And over.":"정오 안에서는 그러지 않아도 되지. 교황께서 내게 하루 전을 돌려주셨다. 나는 갑옷을 닦는다. 넌 사과주를 가져온다. 넌 준비됐다고 말한다. 나는 아니라고 말한다. 끝. 그리고 다시.","It is very kind of him.":"그분은 참 친절하시다.","Evernoon. It's _real_?":"에버눈. _진짜_ 예요?","As real as a summer afternoon, little Keeper. He has filled it with us — the dead. We walk its streets. We wear ourselves like coats.":"여름 오후만큼 진짜란다, 어린 수호자여. 그분은 우리로 그곳을 채웠다— 죽은 자들. 우린 그 거리를 걷는다. 우리는 옷처럼 우리를 걸친다.","When he needs a hand out here, he sends one of us. We fit very well. We remember our own swords.":"바깥에 손이 필요하면 우리 중 하나를 보내지. 우린 아주 잘 맞는다. 우리는 우리 검을 기억한다.","Bram. You froze. You froze again.":"브람. 넌 얼어붙었다. 또 얼어붙었어.","I did.":"그랬지.","And then I didn't.":"그리고 그러지 않았어.","Something moves in the empty eyes. A flicker — like a candle seen through a window, far back in the house.":"빈 눈 속에서 무언가 움직인다. 깜박임— 창문 너머로 본 촛불처럼, 집 아주 깊은 곳의.","..._Good lad._":"…_잘 싸웠다, 녀석._","The armor falls in on itself, full of nothing, and the nothing blows away on the wind.":"갑옷이 제 안으로 주저앉고, 아무것도 없이 가득 차 있다가, 그 아무것도가 바람에 날려 간다.","He used to say that. After drills. Every time. Even when I was terrible.":"그 말을 하셨었지. 훈련 끝나고. 매번. 내가 형편없을 때도.","I was always terrible.":"난 늘 형편없었어.","The Penitent was Sir Aldous — or something wearing him. Evernoon is real, and it's full of the dead, worn like coats. Bram froze. Then he didn't. At the very end, something in Aldous's eyes said \"good lad.\"":"참회자는 알두스 경이었다— 아니면 그를 걸친 무언가였다. 에버눈은 진짜다. 그리고 옷처럼 걸친 죽은 자들로 가득하다. 브람은 얼어붙었다. 그리고 그러지 않았다. 아주 끝에, 알두스의 눈 속 어떤 것이 \"잘 싸웠다, 녀석\"이라 했다.","Morning, if there were mornings. The Nest is full of sleeping children, and one small boy in a hammock, stitched up from collarbone to hip.":"아침, 아침이라는 게 있다면. 둥지는 잠든 아이들로 가득하고, 작은 소년 하나가 해먹에 누워 있다, 쇄골에서 허리까지 꿰매 놓은 채.","He's going to live. Two things: he's going to have a scar, and he's going to be insufferable about it.":"살아날 거야. 두 가지: 흉터가 남을 거고, 그걸로 견딜 수 없이 거들먹거릴 거야.","_(weakly)_ ...already am.":"_(약하게)_ …이미 그러는데.","Did we win? Was that... was that _Bram_? Swinging that big stupid sword?":"이겼어? 방금 그거… _브람_ 이었어? 그 크고 멍청한 검을 휘두른 게?","Go to sleep, Pip.":"자, 핍.","Make me.":"재워 봐.","He's asleep before she can answer. Ilse doesn't let go of his hand.":"그녀가 대답하기 전에 그는 잠들어 있다. 일세는 그의 손을 놓지 않는다.","I froze.":"난 얼어붙었어.","You did. Then you fought.":"그랬지. 그리고 싸웠어.","Sir Aldous used to say courage was a thing you _do_, not a thing you _have_. \"You act while you're afraid, lad, or you never act at all.\" I thought he was being nice. He was always being nice.":"알두스 경은 용기란 _하는_ 것이지 _가진_ 게 아니라고 하셨지. \"무서워도 움직여라, 녀석. 아니면 영영 못 움직인다.\" 난 그분이 위로하는 건 줄 알았어. 그분은 늘 위로했지.","I spent a year making sure I never had to find out if he was right.":"난 일 년을 그분이 맞는지 알아보지 않아도 되게 만드는 데 썼어.","I gave Cassian the Dawnstone, Bram. I'm the reason any of this happened. I didn't freeze. I ran straight at it.":"난 카시안에게 새벽석을 줬어, 브람. 이 모든 일이 일어난 건 나 때문이야. 난 얼어붙지 않았어. 정면으로 뛰어들었지.","If you're a coward, I don't know what that makes me.":"네가 겁쟁이라면, 난 뭔지 모르겠어.","...That makes you _ours_.":"…그럼 넌 _우리 것_ 이지.","If you'll have a coward.":"겁쟁이를 받아 준다면.","We'll have Bram.":"브람은 받을 거야.","And— you paid the Baron. For my shield. I pawned it the first week. Thought I didn't deserve to carry it.":"그리고— 남작에게 내 방패 값을 갚았어. 첫 주에 전당포에 맡겼지. 들 자격이 없다고 생각했어.","You don't have to deserve it. You just have to carry it.":"자격이 있어야 드는 게 아니야. 그냥 들고 있으면 돼.","One thing. The Penitent's barge went west, toward the Noon Spire. If we're going after Evernoon, we need wings.":"한 가지. 참회자의 바지선이 서쪽으로 갔어, 정오 첨탑 쪽으로. 에버눈을 쫓으려면 날개가 필요해.","The Baron's been dunning an airship captain for eleven thousand silver. Holed up at a place called Corvin's Roost.":"남작이 비행선 선장 하나에게 만 천 은화를 독촉하고 있어. 코르빈의 둥지라는 곳에 틀어박혀 있대.","_Corvin?_ Corvin's alive?":"_코르빈?_ 코르빈이 살아 있어?","And owes everybody money. So: yes. Definitely Corvin.":"그리고 모두에게 돈을 빚지고 있지. 그래: 맞아. 틀림없이 코르빈이야.","Wren.":"렌.","Yeah?":"응?","When Pip went down, you went straight at that thing. You didn't even look back to see if I was behind you.":"핍이 쓰러졌을 때, 넌 그놈에게 곧장 달려갔어. 내가 뒤에 있는지도 안 돌아봤어.","I didn't have to. I knew you were there.":"볼 필요 없었어. 거기 있는 거 알아.","...I was.":"…있었어.","It is not forgiveness. But it is not nothing.":"용서는 아니야. 하지만 아무것도 아닌 것도 아니지.","Pip wants to see you at the Kite Cliffs (east of the Nest) when he's on his feet.":"핍이 일어나면 연 벼랑(둥지 동쪽)에서 보자고 한다."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch8c.json
          cat > i18n/parts/ch8d.json <<'KJSON'
          {"Bram is with us. \"If you'll have a coward.\" We'll have Bram. Pip will live — scar and all. And Corvin is alive, hiding from his debts at a place called Corvin's Roost.":"브람이 우리와 함께한다. \"겁쟁이를 받아 준다면.\" 브람은 받는다. 핍은 살 것이다— 흉터까지 붙여서. 그리고 코르빈은 살아 있다, 코르빈의 둥지라는 곳에서 빚을 피해 숨어서.","On the highest point of the Kite Cliffs, where the wind never stops, Pip sits with a kite across his knees. Red and gold. Brand new.":"연 벼랑 가장 높은 곳, 바람이 멈추지 않는 자리에, 핍이 무릎 위에 연을 얹고 앉아 있다. 빨강과 금색. 새것.","Ilse says I'm not allowed up here. Ilse says a lot.":"일세가 여기 올라오면 안 된대. 일세는 말이 많아.","That's a good kite.":"좋은 연이네.","I've built a hundred. For the littles. Best kites on the shard.":"백 개는 만들어 봤어. 작은 것들 거. 바위 조각에서 제일 좋은 연들이지.","Never flown one. Not once.":"한 번도 안 날려 봤어. 단 한 번도.","Why not?":"왜?","Somebody's got to hold the string. Somebody's got to watch the ladders. Count heads. Find the food. Know where everybody is. That's the Boss.":"누군가는 줄을 잡아야 하고. 누군가는 사다리를 봐야 하고. 인원을 세고. 먹을 걸 찾고. 모두가 어디 있는지 알아야 해. 그게 두목이야.","You can't do that and look up.":"그러면서 하늘은 못 봐.","I'll hold it.":"내가 잡아 줄게.","What?":"뭐?","The Kites. For a bit. Tansy's got the ladders. Ilse's got the Nest — nobody's getting past Ilse. Bram's counting heads, very badly, out loud.":"연들. 잠깐만. 사다리는 탠지가 있잖아. 둥지는 일세가 있어— 일세는 아무도 못 지나가. 브람이 인원을 세고 있어, 아주 서툴게, 소리 내서.","You fly it.":"날려 봐.","I'm the _Boss_, I don't—":"난 _두목_ 이라서, 그런 건—","You're twelve.":"넌 열두 살이야.","...Twelve and a half.":"…열두 살 반.","He stands. He holds it up into the wind. The wind takes it — snatches it — and the string sings off the spool, up and up into the bruised sky.":"그가 일어난다. 바람 속에 연을 높이 든다. 바람이 가져간다—낚아챈다—그리고 줄이 실패에서 노래하듯 풀려, 멍든 하늘로 올라가고 또 올라간다.","Look at it go— look at it _GO!_ Wren! WREN, LOOK!":"봐, 가잖아— _간다!_ 렌! 렌, 봐!","I'm looking.":"보고 있어.","Pip laughs. Not the hard, old laugh. A kid's laugh — too loud, cracking in the middle, completely helpless.":"핍이 웃는다. 굳고 늙은 웃음이 아니다. 아이 웃음— 너무 크고, 중간에 갈라지고, 완전히 제어가 안 된다.","...Don't tell the Kites.":"…연들한테는 말하지 마.","Tell them what?":"뭐라고?","That I'm a kid.":"내가 애라고.","Pip. They know.":"핍. 걔들은 알아.","Boss! Ilse says you have to come down or she'll— whoa. Is that _yours?_":"두목! 일세가 안 내려오면 그러신대— 우와. 저거 _네 거야?_","Tansy. When we go — and we're going — who minds the Kites?":"탠지. 우리가 갈 때— 가긴 갈 거야— 연들은 누가 돌봐?","Me. I'm nine and three-quarters. That's basically ten.":"나! 나 아홉 살하고 사분의 삼이야. 그럼 사실상 열 살이지.","Yeah. Yeah, okay. Basically ten.":"그래. 그래, 좋아. 사실상 열 살.","*Pip* rejoins the party.":"*핍* 이 파티에 합류했다.","Take the Baron's skiff from the south-west dock to Corvin's Roost when you are ready.":"준비되면 남서쪽 부두에서 남작의 소형 배를 타고 코르빈의 둥지로 가라.","Pip flew a kite. His first one, ever. He laughed like a kid. Tansy will mind the Kites — she's \"basically ten.\" Next: Corvin's Roost.":"핍이 연을 날렸다. 태어나 처음으로. 아이처럼 웃었다. 탠지가 연들을 돌볼 것이다— 그녀는 \"사실상 열 살\"이다. 다음: 코르빈의 둥지.","Baron's skiff. Baron's orders. Baron's bad mood. Come back with a reason.":"남작의 소형 배. 남작의 명령. 남작의 심기 불편함. 이유를 갖고 돌아와.","Baron says you're to have the skiff. Says it's \"an investment.\" Said it like it hurt him.":"남작이 소형 배를 쓰라고 한다. \"투자\"라고 한다면서. 말할 때 아파 보였다.","Skiff'll wait. Baron won't, but the skiff will.":"배는 기다릴 거야. 남작은 안 그러겠지만, 배는 기다려.","Corvin Ashe. Last time I saw him he owed me four silver and a boot.":"코르빈 애시. 마지막으로 봤을 때 은화 네 닢이랑 장화 한 짝을 빚졌지.","Last time I saw him I _was_ the four silver.":"마지막으로 봤을 때 나는 _그 은화 네 닢_ 이었어.","Three things. One, he's a coward. Two, he's a liar. Three—":"세 가지. 하나, 걘 겁쟁이야. 둘, 걘 거짓말쟁이야. 셋—","Three, he's ours.":"셋, 걘 우리 편이야.","...I was going to say \"three, he has an airship.\" But fine.":"…셋은 \"걔한테 비행선이 있다\"라고 하려던 건데. 뭐, 좋아.","We left Kiteholm on the Baron's skiff. Twenty Kites on the lines, waving. Tansy saluted. Pip pretended not to see, and then saluted back.":"우린 남작의 소형 배를 타고 카이트홀름을 떠났다. 줄 위의 연 스무 명이 손을 흔들었다. 탠지는 경례했다. 핍은 못 본 척하다가, 그러고는 답례했다.","Find Corvin Ashe at Corvin's Roost.":"코르빈의 둥지에서 코르빈 애시를 찾아라.","A pleasure doing business. Rarely is.":"거래는 즐거웠소. 그런 경우는 드물지.","Kestrel's friends. Charming. Your Kestrel owes me fifteen hundred silver in drink, damages, and one very expensive coat rack.":"케스트럴의 친구들. 매력적이군. 너희 케스트럴은 내게 은화 천오백 닢을 빚졌어. 술값, 손해 배상, 그리고 아주 비싼 옷걸이 하나.","He pawned me a shield against it his first week. Dawnguard steel. Dented. Sentimental garbage, but garbage is my trade.":"첫 주에 그걸 담보로 방패를 맡겼지. 새벽수호대 강철. 찌그러진. 추억팔이 쓰레기. 하지만 쓰레기가 내 업종이야.","Bram's Debt":"브람의 빚","Bram owes Baron Dask 1,500 gold. Paying it will redeem the shield Bram pawned.":"브람은 다스크 남작에게 금화 1,500닢을 빚지고 있다. 갚으면 브람이 맡긴 방패를 되찾는다.","The debt keeps. Interest is my love language.":"빚은 익어 가네. 이자는 내 사랑의 언어라오.","Your purse says no. I always listen to purses.":"지갑이 아니라고 하는군. 나는 언제나 지갑 말을 듣지.","Paid in full. How sweet. Here — take the man's shield. It's been looking at me.":"전액 상환. 감동이군. 자— 이 남자 방패 가져가. 계속 나를 쳐다보고 있었어.","I own the air. Breathe carefully.":"하늘은 내 거요. 숨은 조심히 쉬시오.","Midnight. I'm off at midnight.":"자정이야. 난 자정이면 퇴근이야.","Don't look at me like that. Ilse's already looking at me like that. There's only so much _that_ a man can take.":"그렇게 보지 마. 일세도 이미 그렇게 보고 있어. 사람이 그런 _시선_ 을 견디는 데도 한계가 있어.","I'm on duty. Can't talk. Very important. Guarding.":"근무 중이야. 말 못 해. 아주 중요해. 경비.","...Guarding a door. From people who want to come in and ask the Baron for money. It's mostly me telling them no.":"…문을 지키는 거. 들어와서 남작에게 돈을 달라는 사람들로부터. 대개는 내가 안 된다고 말하는 일이지.","I'm good at telling people no. Started with myself.":"난 사람한테 아니라고 말하는 걸 잘해. 나한테서 시작했어.","When you find Ashe, tell him Quill says his port wing still pulls left. He'll know. He'll pretend he doesn't, but he'll know.":"애시를 찾으면 전해 줘, 퀼이 말하기를 좌현 날개가 아직도 왼쪽으로 쏠린대. 걘 알 거야. 모르는 척하겠지만, 알 거야.","Airship cogs! Real ones! Oh, she'll fly now. Well — she'll fall slower. Same thing, up here.":"비행선 톱니바퀴! 진짜로! 이제 날겠어. 뭐— 더 천천히 떨어지겠지. 여기선 같은 말이야.","I built wings for the _Halcyon_, you know. Years back. Corvin Ashe's ship. If he's alive, she's rusting at the Roost, and he's drinking next to her, telling her it's not her fault.":"내가 _할시온_ 의 날개를 만들었어, 알지. 몇 년 전에. 코르빈 애시의 배. 걔가 살아 있다면 그 배는 둥지에서 녹슬고 있고, 걘 옆에서 술 마시며 자기 탓이 아니라고 말해 주고 있겠지.","Take this. A wright's monocle. You see how things fit together, after a while.":"이걸 가져. 장인의 단안경이야. 좀 지나면 사물이 어떻게 맞물리는지 보이게 될 거야.","Kite-wright. Glider-wright. Wright of anything that wants to be in the air and shouldn't be.":"연 장인. 활공기 장인. 하늘에 있고 싶어 하면서 있으면 안 되는 것들의 장인.","I'm building a glider big enough to carry the Kites off this rock if it ever cracks. I need three airship cogs. The scrap-golems down in the Underhang have 'em in their bellies — don't ask how.":"난 이 바위가 갈라지면 연들을 태워 내보낼 만큼 큰 활공기를 짓고 있어. 비행선 톱니바퀴 세 개가 필요해. 언더행 아래 고물 골렘들이 배 속에 넣고 있지— 어떻게 그랬는지는 묻지 마.","The Kite-Wright":"연 장인","Gaffer Quill needs 3 Scrap Gears (scrap golems in the Underhang and the Vigil carry them) for an escape glider.":"개퍼 퀼에게 탈출 활공기를 만들 고물 톱니바퀴 3개가 필요하다(언더행과 비질의 고물 골렘이 지니고 있다).","MY KITE! You got it off the shrikes? Nobody gets anything off the shrikes!":"내 연! 폭풍새한테서 되찾은 거야? 폭풍새한테서 뭘 되찾는 사람은 없는데!","Here. It's my best thing. A fruit off the Baron's roof-tree. He counts them. He'll never notice. He'll _definitely_ notice.":"여기. 내 최고 보물이야. 남작 지붕나무에서 딴 과일. 남작은 그걸 세. 절대 못 알아볼 거야. 절대 _알아보겠지만_.","I'm teaching it to do loops. It doesn't want to. We're negotiating.":"곡예를 가르치는 중이야. 하기 싫어하네. 협상 중이야.","The gale-shrikes of the Underhang stole Wick's blue kite. They nest on the western ledges.":"언더행의 폭풍새들이 윅의 파란 연을 훔쳐 갔다. 서쪽 선반에 둥지를 튼다.","I dreamed it was my birthday forever. It was nice. I don't want to go back.":"영원히 내 생일인 꿈을 꿨어. 좋았어. 돌아가고 싶진 않아.","Does that make sense? I don't want it even though it was nice.":"말이 돼? 좋았는데도 돌아가고 싶지 않아.","Also the shrikes took my kite. That's a separate sadness.":"그리고 폭풍새들이 내 연도 가져갔어. 그건 별개의 슬픔이야.","Welcome to the Scrap Arena, darlings! Kiteholm's finest — and only — entertainment, now that the Baron's banned singing.":"고물 투기장에 온 걸 환영해, 자기들! 카이트홀름 최고—그리고 유일한—오락거리야, 남작이 노래를 금지한 뒤로는.","Four ranks. Win and you get prizes. Lose and you get carried out. The crowd enjoys both equally.":"네 단계. 이기면 상품, 지면 실려 나가. 관중은 둘 다 똑같이 좋아해.","The Scrap Arena":"고물 투기장","Fight through the four ranks of Madame Ratchet's Scrap Arena.":"라셰 부인의 고물 투기장 네 단계를 뚫어라.","Champions! The crowd adores you. The crowd also adored a goat that could count, so don't let it go to your heads.":"챔피언들! 관중이 너희를 아낀다. 셈하는 염소도 아꼈으니, 우쭐대지는 마.","Cold feet? We have braziers for that.":"발이 시려? 그런 사람들에겐 화로가 있단다.","Carried out! The crowd is delighted. Do come again — we patch you for free. It's in the ticket price.":"실려 나갑니다! 관중은 기뻐요. 또 오세요— 치료는 무료예요. 입장료에 포함이랍니다."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch8d.json
          git add i18n/parts/ch8c.json i18n/parts/ch8d.json
          git commit -m "ko: 8장 2/2(비질·참회자·연 벼랑)"
          git push origin HEAD:main
