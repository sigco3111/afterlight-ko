name: ko6-clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 정리
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f go || echo 'go 없음'
          git rm -f .github/workflows/ko6-tmp.yml .github/workflows/ko6-tmp2.yml .github/workflows/ko6-tmp3.yml .github/workflows/ko6-scan.yml .github/workflows/ko6-scan2.yml .github/workflows/ko6-clean.yml || echo '일부 워크플로 없음'
          git commit -m '정리: 6차 임시 러너 워크플로·스크립트 삭제 [skip ci]' || echo '커밋할 것 없음'
          git push origin HEAD:refs/heads/main || echo 'push 실패'
