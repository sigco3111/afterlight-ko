name: go-clean
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 삭제
        run: |
          git config user.email ko3@local
          git config user.name ko3
          git rm -r --quiet go || true
          for f in go-scan.yml go-scan2.yml go-scan3.yml go-scan4.yml go-scan5.yml go-clean.yml; do
            git rm --quiet ".github/workflows/$f" || true
          done
          git commit -m "정리: 3차 임시 스캔 스크립트·워크플로 삭제"
          git push
