name: ko-fix
on:
  push:
    paths:
      - '.github/workflows/ko-fix.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fix
        run: |
          node tools/fix-build.mjs
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'CI: 배포에 플레이테스트 저장 포함·환경 URL 수정'
          git push
