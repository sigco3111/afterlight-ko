name: ko-w1
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write parts
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          cat > i18n/parts/ch8a.json <<'KJSON'
          {"Kiteholm. A spur of rock torn off the old world, hanging in the wind like a fist that refuses to open.":"카이트홀름. 옛 세상에서 뜯겨 나온 바위 갈래가, 열리기를 거부하는 주먹처럼 바람 속에 매달려 있다.","Shacks of scrap and sailcloth cling to it. And everywhere — on poles, on roofs, on strings tied to children — kites.":"고철과 돛천으로 엮은 판잣집들이 그 위에 매달린다. 그리고 사방에— 장대에, 지붕에, 아이들에게 묶인 줄에— 연이.","It's all... string.":"전부… 줄이네.","Fenna said it's held _together_ by kites. Held _up_ by stubbornness.":"페나 말로는 저 연들이 _붙잡아_ 준대. 고집이 _떠받치고_ 있고.","That's not how engineering works.":"그건 공학이 그렇게 작동하지 않아.","That's not how anything works anymore.":"이제는 아무것도 그렇게 작동하지 않아.","A pebble cracks off the planks between Wren's boots.":"렌의 장화 사이 널빤지에서 자갈 하나가 톡 튀어 나간다.","Toll's two silver or one secret. Slingshot says pay up.":"통행료는 은화 두 닢, 아니면 비밀 하나. 슬링샷 말로는 내라고 했어.","We're looking for someone. A boy called Pip.":"사람을 찾고 있어. 핍이라는 애를.","Don't know him. Two silver.":"몰라. 은화 두 닢.","Twelve years old. Talks like a pirate. Steals anything that isn't nailed down and most things that are.":"열두 살. 해적처럼 말하는 애. 못 박지 않은 건 뭐든 훔치고, 박힌 것도 대부분 훔쳐.","...Three silver. And you didn't hear it from me.":"…은화 세 닢. 그리고 나한테 들은 건 아니야.","She didn't hear it from anybody, Tansy. Go keep watch.":"아무한테도 들은 거 아니야, 탠지. 가서 망 봐.","He is taller. Thinner. A scarf, a scavenged coat — and a patch over his left eye. He looks at Wren for a long time with the other.":"더 키가 크고, 더 말랐다. 목도리, 주워 입은 코트— 그리고 왼쪽 눈을 덮은 안대. 그는 남은 눈으로 한참 동안 렌을 본다.","Well. Look what the wind dragged in.":"그래. 바람이 뭘 끌고 왔나 했더니.","Pip. Your eye—":"핍. 네 눈—","Lost it in a card game. You should see the other guy's eye.":"카드놀이에서 잃었어. 상대 눈을 봐야 할 걸.","...He's got both. I lost. That's how card games work.":"…걔는 둘 다 있거든. 내가 졌어. 카드놀이가 원래 그런 거야.","Pip. Let me look at it.":"핍. 나 좀 보게 해.","It's healed, Ilse. Healed ugly, but healed. Like everything.":"나았어, 일세. 못생겼지만 나았어. 세상 모두처럼.","Thought you were dead, Halloway. Hoped so, some days.":"죽은 줄 알았는데, 할러웨이. 어떤 날은 그래 줬으면 했고.","...I know.":"…알아.","Rules of Kiteholm. One: Kites look after Kites. Two: you ain't Kites. Three: the Baron owns the air, so pay your mooring fee and don't make trouble.":"카이트홀름의 규칙. 하나: 연은 연을 돌본다. 둘: 넌 연이 아니다. 셋: 하늘은 남작 거다, 그러니 계류비나 내고 말썽 부리지 마.","We came to find you. You and Bram.":"널 찾으러 왔어. 너랑 브람.","Bram.":"브람.","Pip laughs. It is not a kid's laugh.":"핍이 웃는다. 애 웃음소리가 아니다.","Bram's at the Rusty Anchor, or the Baron's door, or face-down somewhere between 'em. Go find him. He won't want to be found. He's real good at that.":"브람은 녹슨 닻에 있거나, 남작의 문 앞에 있거나, 그 사이 어딘가에 얼굴 박고 쓰러져 있을 거야. 가서 찾아. 찾아지길 원하진 않겠지만. 그건 진짜 잘해.","He's twelve.":"열두 살이라니까.","He's twelve going on forty.":"열두 살에 마흔은 넘은 놈이지.","That's what I said.":"내가 하는 말이 그거야.","Find Bram at the Rusty Anchor (the tavern on Kiteholm's west side).":"녹슨 닻(카이트홀름 서쪽의 선술집)에서 브람을 찾아라.","Kiteholm. Pip is twelve now, with one eye and twenty orphans who call him Boss. He said he hoped I was dead, some days. I can't blame him.":"카이트홀름. 핍은 이제 열두 살이고, 눈이 하나며, 자신을 두목이라 부르는 고아가 스무 명이다. 어떤 날은 내가 죽었으면 했다더라. 탓할 수 없다.","Hah! Full Lantern! Read 'em and—":"하하! 랜턴 만땅! 읽어 보고—","...oh. That's not a full Lantern. That's three bells and a fish.":"…아. 만땅 아니네. 종 세 개에 물고기 하나잖아.","That's nine silver, is what that is.":"그거면 은화 아홉 닢이라고.","Bram looks up. His face does something complicated. Then he picks up his cup and drains it.":"브람이 고개를 든다. 얼굴이 복잡하게 무언가를 해 본다. 그러고는 잔을 집어 단숨에 비운다.","No. Nope. I'm drunk. I'm seeing ghosts. It's the cider. This is mostly cider.":"아니야. 안 돼. 난 취했어. 유령이 보여. 사과주 탓이야. 이건 거의 사과주야.","It is mostly not cider, Bram. I can smell it from here.":"거의 사과주는 아니야, 브람. 여기서도 냄새가 나.","..._Ilse?_":"…_일세?_","He stands too fast. The chair goes over. For one second he looks like he's going to throw his arms around both of them —":"그는 너무 빨리 일어난다. 의자가 넘어진다. 한순간 그는 둘 모두를 와락 안을 것처럼 보인다—","— and then he doesn't.":"— 그리고 그러지 않는다.","You're... alive. Both of you. That's— that's—":"너희… 살아 있었어. 둘 다. 그게— 그게—","Good. That's good. I'm glad.":"좋아. 좋은 일이지. 다행이야.","I'm working. Guard duty. The Baron. I have to— I'm _very_ important to the Baron.":"난 일하고 있어. 경비 근무. 남작님. 나는— 남작님께 _아주_ 중요한 사람이야.","He talks about you. When he's far enough gone. \"My girls from the island.\"":"그가 너희 얘기를 해. 거의 넋이 나갈 만큼 취했을 때. \"내 섬에서 온 아이들.\"","Then he cries and tries to fight the coat rack. Loses, mostly.":"그러고는 울면서 옷걸이랑 싸우려 들지. 대개는 지고.","He ran.":"도망갔어.","He ran _from us_. That's different.":"우리에게서 _도망간_ 거지. 그건 다르지.","Is it?":"그래?","...I hope so.":"…그랬으면 좋겠어.","Go to the Kite Nest (the red-roofed house by the market) and talk to Pip.":"연의 둥지(시장 옆 빨간 지붕 집)로 가서 핍과 이야기하라.","Bram is here. He saw us and ran — said he was \"very important to the Baron.\" Dorran says he cries at the coat rack. I think he's been running for a year.":"브람이 여기 있다. 우리를 보고 도망갔다— 남작님께 \"아주 중요한\" 사람이라더라. 도란은 그가 옷걸이 앞에서 운다고 했다. 일 년째 도망쳐 온 것 같다.","He's not here.":"여기 없어.","Pip? Where is he?":"핍? 어디 갔어?","Wick and Moth went scavenging two days ago. Down the Underhang, to the old Choir wreck. Good scrap down there. They didn't come back.":"이틀 전에 윅이랑 모스가 고물 주우러 갔어. 언더행 아래, 옛 성가대 난파선으로. 거기 고물이 좋거든. 안 돌아왔어.","Boss went after them. Alone. He told us to stay. He said grown-ups don't help, grown-ups just get you counted.":"두목이 뒤쫓아 갔어. 혼자. 우리는 남으라고 했어. 어른들은 돕지는 않고, 사람 세는 데나 쓴다고 했어.","You're grown. Sort of.":"넌 어른이지. 비슷하게는.","I'm seventeen.":"나 열일곱이야.","Exactly. Will you go after him?":"바로 그거. 쫓아갈 거야?","Three things. One, we're going. Two, nobody else from this room is coming. Three—":"세 가지. 하나, 우린 간다. 둘, 이 방에서 다른 사람은 아무도 안 간다. 셋—","Three, Boss'll be furious. I know. I'll tell the Kites to move the crates off the ladder.":"셋, 두목이 화낼 거야. 알아. 사다리 위에 있는 궤짝들 치우라고 연들한테 일러 둘게.","Follow Pip down the Underhang — the ladder at Kiteholm's south edge.":"언더행으로 핍을 쫓아 내려가라— 카이트홀름 남쪽 가장자리의 사다리.","Two of Pip's Kites went missing in a crashed Choir ship under the shard. Pip went after them alone. We're going down after him.":"핍의 연 둘이 바위 조각 아래 난파한 성가대 배에서 실종됐다. 핍은 혼자 뒤쫓아 갔다. 우리도 그를 따라 내려간다.","The Baron. Now. He's got guards and walls. Kiteholm's got kites.":"남작. 지금. 그에겐 경비병과 성벽이 있어. 카이트홀름에겐 연이 있고.","Kites look after Kites.":"연은 연을 돌본다.","When I grow up I'm going to be the Boss of the Boss.":"나 크면 두목의 두목이 될 거야.","Don't tell him.":"걔한테는 말하지 마.","ALL FIVE? Even Sprocket? Nobody ever finds Sprocket. _I_ don't find Sprocket.":"다섯 전부? 스프로킷까지? 스프로킷은 아무도 못 찾아. _나_ 도 못 찾는다니까.","Okay. Okay. You can have it. It's the tail off the first kite Boss ever built. It's lucky. It makes you fast. That's science.":"좋아. 좋아. 그럼 가져. 두목이 처음 만든 연의 꼬리야. 행운이 있어. 빨라지게 해 줘. 그게 과학이야.","Five of the lookouts are supposed to be on watch. They're not on watch. They're _hiding_. It's a game, but it's also a crime.":"망꾼 다섯이 망을 보고 있어야 해. 보고 있지 않아. _숨어_ 있어. 놀이지만 그것도 죄야.","Burr, Fig, Nettle, Pim, and Sprocket. Find 'em all and I'll give you something good. Promise on my slingshot.":"버, 피그, 네틀, 핌, 스프로킷. 다 찾으면 좋은 거 줄게. 내 새총에 걸고 약속해.","Hide and Seek":"숨바꼭질","Find the five Kites hiding around Kiteholm: Burr, Fig, Nettle, Pim and Sprocket. Report to Tansy.":"카이트홀름 곳곳에 숨은 연 다섯을 찾아라: 버, 피그, 네틀, 핌, 스프로킷. 탠지에게 보고하라.","Toll's paid. You're fine. Don't touch the kites. They bite.":"통행료 냈어. 넌 괜찮아. 연은 만지지 마. 물어.","Shh! I'm still hiding. It counts if I keep hiding.":"쉿! 아직 숨어 있는 중이야. 계속 숨으면 그것도 되는 거야.","I'm on watch. Very hard. Go away.":"망 보는 중이야. 아주 열심히. 저리 가.","Rope ladders. Ledges no wider than a table. Below them: nothing at all, for as far as the haze lets you see.":"밧줄 사다리. 탁자만 한 선반들. 그 아래로는— 안개가 보이는 데까지 아무것도 없다.","For the record, I hate this.":"기록해 두는데, 난 이거 싫어.","Noted.":"적어 뒀어.","I want it _written down_.":"_기록으로_ 남겨 두라고.","On the roc perch, a boy with a knife in each hand has his back to the cliff — and three gale-shrikes have him pinned.":"록 새장 위, 양손에 칼을 든 소년이 벼랑에 등을 대고 있다— 그리고 폭풍새 세 마리가 그를 몰아세웠다.","Come on then! Come _on!_ I've got more knives than you've got eyes!":"그래, 덤벼! _덤비라고!_ 내 칼이 네 눈보다 많아!","PIP!":"핍!","I had them.":"내가 잡을 수 있었어.","You had them _surrounding you_.":"_포위당해_ 있었잖아.","That's a strategy. Bram taught me. \"Let them come to you.\"":"그것도 전략이야. 브람이 가르쳐 줬어. \"오게 두라.\"","Bram's strategies mostly involve falling over.":"브람의 전략은 대개 넘어지는 거야.","..._Tactically._":"…_전술적으로._","Wick and Moth went into the wreck. The _Vigil_. I saw Vesper colors on the hull. Somebody's using it.":"윅이랑 모스가 난파선에 들어갔어. _비질_에. 선체에 베스퍼 색이 보여. 누가 쓰고 있어.","Then we go in together.":"그럼 같이 들어간다.","Fine. Kites look after Kites. You're temporary Kites. _Very_ temporary.":"좋아. 연은 연을 돌본다. 넌 임시 연이야. _아주_ 임시.","And nobody calls me \"kid.\" I'm the Boss.":"그리고 누구도 날 '꼬마'라고 부르지 마. 난 두목이야.","Descend to the wreck of the Vigil and find Wick and Moth.":"비질의 난파선으로 내려가 윅과 모스를 찾아라."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch8a.json
          cat > i18n/parts/ch8b.json <<'KJSON'
          {"Found Pip on a cliff ledge, fighting three shrikes and losing. He let us help. We're \"temporary Kites.\" Very temporary.":"벼랑 선반에서 폭풍새 셋과 싸우다 밀리는 핍을 찾았다. 우리가 돕게 허락했다. 우린 \"임시 연\"이다. 아주 임시.","A dead campfire. A bedroll. A Vesper scout's satchel, and a journal with a broken spine:":"꺼진 모닥불. 침낭. 베스퍼 정찰병의 가방, 그리고 등이 부러진 일지 한 권:","\"Day 9. Counted the shanty. Twenty-two children under fourteen. The Penitent will be pleased. He says children remember the best days best.\"":"\"9일째. 판잣집 수를 셌다. 열네 살 미만 아이가 스물둘. 참회자는 기뻐하겠지. 아이들은 가장 좋았던 날을 가장 잘 기억한다고 했다.\"","\"Day 10. A boy with one eye watched me from the kites all afternoon. I think he knows. I think he is waiting for me to come back up.\"":"\"10일째. 눈이 하나인 소년이 오후 내내 연 위에서 나를 지켜봤다. 그는 아는 것 같다. 내가 다시 올라오기를 기다리는 것 같다.\"","The rest of the pages are blank.":"나머지 페이지는 비어 있다.","Huh. He never came back up.":"흠. 끝내 안 올라왔네.","Pip...?":"핍…?","Don't look at me like that. I didn't do nothing. The wind did. The wind takes care of Kiteholm.":"그렇게 쳐다보지 마. 난 아무것도 안 했어. 바람이 했지. 바람은 카이트홀름을 돌봐.","An empty nest of sticks and sailcloth.":"나뭇가지와 돛천으로 된 빈 둥지.","Tangled in a shrike's nest: a patched blue kite with a painted grin. The string is still tied to a little bone toggle carved like a W.":"폭풍새 둥지에 엉킨 것: 꿰맨 파란 연, 웃는 얼굴이 그려져 있다. 줄은 아직 W 모양으로 조각한 작은 뼈 토글에 묶여 있다.","Wick's Kite":"윅의 연","A blue kite with a painted grin, rescued from a shrike nest in the Underhang. It belongs to Wick, one of Pip's Kites.":"언더행의 폭풍새 둥지에서 구해 낸, 웃는 얼굴이 그려진 파란 연. 핍의 연들 중 하나인 윅의 것이다.","That's Wick's. He's been looking for it for a month. Shrikes nick anything shiny. Or blue. Or Wick's.":"윅 거야. 한 달째 찾고 있었어. 폭풍새는 반짝이는 건 뭐든 물어 가. 아니면 파란 거라든가. 아니면 윅의 거라든가.","Inside the hull, everything leans. And somewhere ahead, faintly, a music box is playing a lullaby.":"선체 안은 전부 기울어져 있다. 그리고 앞쪽 어딘가에서, 희미하게, 오르골이 자장가를 연주하고 있다.","That's not ours. Kites don't do lullabies.":"우리 건 아냐. 연들은 자장가를 부르지 않아.","What do Kites do?":"연들은 뭘 하는데?","Bedtime threats. \"Go to sleep or the Baron gets your boots.\"":"잠자리 협박. \"안 자면 남작이 네 장화를 가져간다.\"","The captain's desk. Charts of the shards, with Kiteholm circled in violet ink.":"선장의 책상. 바위 조각 해도들, 카이트홀름이 보라색 잉크로 동그라미 쳐져 있다.","Orders, under a paperweight shaped like a sun:":"명령서. 태양 모양 문진 밑에:","\"_By the hand of the Penitent:_ The children of the Underhang shards are to be gathered and kept sleeping until the Hierophant's barge arrives. Children remember the best days best. Evernoon has need of them.\"":"\"_참회자의 손으로:_ 언더행 바위 조각들의 아이들을 모아, 교황의 바지선이 닿을 때까지 잠들게 하라. 아이들은 가장 좋았던 날을 가장 잘 기억한다. 에버눈에 그들이 필요하다.\"","\"KITEHOLM is next. Twenty children. The Penitent will collect them personally.\"":"\"다음은 카이트홀름이다. 아이 스무 명. 참회자가 직접 거둬 간다.\"","A ring of keys hangs from the captain's chair. One is stamped BRIG.":"선장 의자에 열쇠 고리가 걸려 있다. 하나에 BRIG라고 찍혀 있다.","\"Twenty children.\"":"\"아이 스무 명.\"","There's twenty-two. He can't even count my Kites right.":"스물둘인데. 내 연들 숫자도 제대로 못 세.","Pip.":"핍.","I'm fine. I'm _fine_. Brig's south. Move.":"난 괜찮아. _괜찮아._ 영창은 남쪽. 움직여.","Open the brig (south of the gun deck) with the Brig Key.":"영창 열쇠로 영창(포갑판 남쪽)을 열어라.","A heavy door, banded in iron. A sign on it reads BRIG, and under that, in a child's hand: LET US OUT.":"철로 띠를 두른 무거운 문. 표지판에 영창이라 적혀 있고, 그 밑에 아이의 손글씨로: 꺼내 줘.","The key turns. The door swings in on a long, low groan.":"열쇠가 돌아간다. 문이 길고 낮은 신음과 함께 안쪽으로 열린다.","Cages, built for livestock. And in every cage, a sleeping child — breathing slow and even, eyes moving under the lids.":"가축용으로 만든 우리들. 그리고 모든 우리마다 잠든 아이— 느리고 고르게 숨 쉬고, 눈꺼풀 밑에서 눈알이 움직인다.","Wick! Moth! Up, you lazy— _WICK!_":"윅! 모스! 일어나, 이 게으른— _윅!_","They can't hear you. Pulse is fine. Breathing's fine. It's like... they're dreaming on purpose.":"못 들려. 맥박도 정상이고 숨도 정상이야. 마치… 일부러 꿈을 꾸는 것 같아.","_(asleep)_ ...the cake has... _so many candles_...":"_(잠든 채)_ …케이크에… _촛불이 어찌나 많은지_…","_(asleep)_ ...Mum, it's still sunny... five more minutes...":"_(잠든 채)_ …엄마, 아직 해 있어… 오 분만 더…","The lullaby. It's coming from the front of the ship. They're being _kept_ like this.":"자장가. 배 앞쪽에서 나오고 있어. 저 아이들이 _붙잡혀_ 있는 거야.","Then we break the music box.":"그럼 오르골을 부순다.","We break it into so many pieces it plays every song at once.":"모든 노래가 한꺼번에 나오게 산산조각 내 버리자.","Silence the lullaby at the forecastle (the bow of the Vigil).":"예선 갑판(비질의 뱃머리)에서 자장가를 멈춰라.","In the bow sits a machine like a cathedral organ crossed with a cradle: brass pipes, bellows breathing, and a great drum studded with pins, turning, turning. The lullaby comes out of it, sweet and endless.":"뱃머리에 놓인 기계는 대성당의 오르간과 요람을 섞어 놓은 듯하다: 놋쇠 관, 숨 쉬는 풀무, 그리고 못이 박힌 큰 북이 돌고 또 돈다. 그곳에서 자장가가 흘러나온다, 달콤하고 끝없이.","Shh. Shh. You'll wake them.":"쉿. 쉿. 깨우게.","That's the idea.":"그게 목적이야.","Why? They're _happy_. They're at their birthdays. Every one of them. In the noon they'll never have a bad day again.":"왜? 저것들은 _행복해_. 생일을 보내고 있어. 하나같이. 다시는 나쁜 날을 겪지 않을 그 정오에.","They're in _cages_.":"_우리_ 안에 있잖아.","Everyone is in a cage, little boy. Theirs just has a nicer song.":"모두가 새장 안에 있단다, 꼬마야. 저들 새장은 노래가 더 좋을 뿐이지.","The drum seizes. The pins scream across the comb. The lullaby stops in the middle of a bar — and behind them, down in the brig, a child starts to cry.":"북이 걸린다. 못들이 빗살판을 비명처럼 긁는다. 자장가가 마디 중간에 끊긴다— 그리고 등 뒤, 영창 쪽에서 아이가 울기 시작한다.","That's Moth. Moth always cries when she wakes up. Every time. Like it's a surprise.":"모스야. 모스는 깰 때마다 울어. 매번. 놀란 것처럼.","Boss? ...Boss, you came for us?":"두목? …두목, 우리 찾으러 온 거야?","Course I came. Kites look after Kites.":"물론 왔지. 연은 연을 돌본다.","I dreamed it was my birthday, and Mum was there, and it was sunny, and it was _never going to stop_. Boss, it was so nice.":"내 생일인 꿈을 꿨어, 엄마도 있었고, 해가 났고, 그리고 _바로 끝나지 않을_ 꿈이었어. 두목, 진짜 좋았어.","...Yeah. Yeah, I bet it was.":"…그래. 그래, 그랬겠다.","Pip turns away from them, very fast, so they won't see his face. He turns straight into Wren instead.":"핍이 아주 빠르게 아이들에게서 돌아선다, 얼굴을 보이지 않으려고. 그대로 렌과 정면으로 마주 선다.","Don't.":"하지 마.","I wasn't going to.":"할 생각이었어.","Everyone hold hands. Nobody lets go until we're on the ladder. That's a rule, not a request.":"모두 손잡아. 사다리에 올라갈 때까지 아무도 놓지 마. 이건 부탁이 아니고 규칙이야.","There was a machine in the wreck singing children to sleep, so they'd keep dreaming their best days for \"Evernoon.\" We broke it. Wick dreamed it was his birthday forever. He said it was so nice.":"난파선에 아이들을 잠들게 하는 기계가 있었어, \"에버눈\"을 위해 가장 좋았던 날을 계속 꾸게 하려고. 우리가 부쉈어. 윅은 영원히 생일인 꿈을 꿨어. 아주 좋았다고 했어.","The Kite Nest erupts. Kites everywhere — on beds, on crates, on Wick.":"연의 둥지가 들끓는다. 연들이 사방에— 침대에, 궤짝에, 윅 위에.","You found them! Boss, you found— and _them_, they helped, I _told_ you grown-ups—":"찾았구나! 두목, 찾았— 그리고 _저 사람들_, 도와줬어, 내가 _말했잖아_ 어른들은—","Tansy. Quiet. All of you, quiet.":"탠지. 조용히. 다들, 조용히.","The Vespers are coming. Here. A knight called the Penitent. For you. All of you.":"베스퍼가 온다. 여기로. 참회자라는 기사가. 너희들을. 너희 모두를.","Twenty faces go very still. Nobody cries.":"스무 개의 얼굴이 굳는다. 아무도 울지 않는다.","So here's what we do. We go to the Baron. He's got walls and guards and a big stupid gun on his roof. He keeps the air. He can keep us.":"그래서 이렇게 한다. 남작에게 간다. 그에겐 성벽과 경비병, 지붕 위의 커다란 멍청한 대포가 있어. 하늘을 지키는 사람이니 우리도 지킬 수 있어.","And if he won't?":"안 해 주면?","Then he'll learn what twenty Kites can do to a man's boots.":"그럼 스무 명의 연이 사람 장화에 뭘 할 수 있는지 배우겠지.","Warn Baron Dask at the Baron's Hall (the north terrace).":"남작의 저택(북쪽 테라스)에서 다스크 남작에게 경고하라.","Pipkin Tallow. In my hall. With _guests_. To what do I owe the inconvenience?":"핍킨 탤로. 내 회관에. _손님_ 을 데리고. 이 폐 끼침은 무슨 영광인가?","Vespers. They're coming for my Kites. A knight they call the Penitent. We need your guards on the ladders and your gun on the east cliff.":"베스퍼들이요. 내 연들을 잡으러 옵니다. 참회자라 불리는 기사가. 사다리에 경비병을, 동쪽 벼랑에 대포를 세워 주셔야 합니다.","My guards guard _my_ scrap. My gun guards _my_ air. Your orphans guard themselves; that was always the arrangement.":"내 경비병은 _내_ 고물을 지킨다. 내 대포는 _내_ 하늘을 지킨다. 네 고아들은 스스로를 지켜 왔다. 그게 늘 그래 왔다.","They're children!":"애들이라고요!","And I am a businessman, girl. Children are a _cost_.":"난 사업가다, 아가씨. 아이는 _비용_ 이지.","...The Penitent?":"…참회자?","By the door, Bram has gone the color of old ash.":"문가에서, 브람의 얼굴이 오래된 재빛이 되었다.","Black armor. A mask like a weeping face. He fights with... with his blade held high. Like this.":"검은 갑옷. 우는 얼굴 같은 가면. 그는 칼을… 높이 들어 싸워. 이렇게.","How d'you know that?":"그걸 어떻게 알아?","Everyone in the Dawnguard knows the stories. A knight who... never mind. It's stories.":"새벽수호대에 있으면 다들 그 얘기를 들어. 어떤 기사가… 아니다. 그냥 얘기야.","Bram. Will you stand with us?":"브람. 우리와 함께 설래?","...I'm off duty at midnight.":"…자정엔 근무 끝이야.","Course you are.":"그야 그렇겠지.","Prepare Kiteholm for the raid. When ready, talk to Pip at the Kite Nest to keep watch for the night.":"카이트홀름을 습격에 대비시켜라. 준비되면 연의 둥지에서 핍과 이야기해 밤을 지켜라."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch8b.json
          git add i18n/parts/ch8a.json i18n/parts/ch8b.json
          git commit -m "ko: 8장 1/2(카이트홀름·탠지·브람)"
          git push origin HEAD:main
