name: ko4-tmp
on:
  push:
    branches: [main]
    paths:
      - 'go/scripts/**'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 미번역 문자열 추출
        run: node go/scripts/split.mjs
      - name: 커밋
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add go/out
          git commit -m "ko4: 미번역 문자열 추출 [skip ci]" || echo "no changes"
          git push
