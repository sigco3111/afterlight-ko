name: ko7-tmp
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/ko7-tmp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 사전 병합
        run: node tools/merge-ko.mjs
      - name: 스캔
        run: node go/scan.mjs
      - name: 커밋
        run: |
          git config user.name "ko7-bot"
          git config user.email "ko7-bot@users.noreply.github.com"
          git add src/i18n/ko.json go/untranslated.json
          git diff --cached --quiet || git commit -m "i18n: 7차 사전 병합·미번역 스캔 [skip ci]"
          git push
