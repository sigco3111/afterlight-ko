name: go-scan4
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 확인
        run: node --check go/ko3-scan.mjs
      - name: 스캔
        run: node go/ko3-scan.mjs
