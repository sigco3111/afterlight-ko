name: ko6-tmp3
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ -f go/CLEANUP ]; then echo "mode=cleanup" >> "$GITHUB_OUTPUT"; else echo "mode=probe" >> "$GITHUB_OUTPUT"; fi
      - name: 정리
        if: steps.mode.outputs.mode == 'cleanup'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo '## 정리'
            git rm -r -f go || echo 'rm go failed'
            git rm -f .github/workflows/ko6-tmp.yml .github/workflows/ko6-tmp2.yml .github/workflows/ko6-tmp3.yml || echo 'rm workflows failed'
            git commit -m '정리: 6차 임시 러너 워크플로·스크립트 삭제 [skip ci]' || echo 'commit failed'
            git push origin HEAD:refs/heads/main 2>&1 | tail -3
            echo "push_exit=$?"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.mode == 'probe'
        with:
          node-version: 20
      - name: 사전 병합
        if: steps.mode.outputs.mode == 'probe'
        run: node tools/merge-ko.mjs >> "$GITHUB_STEP_SUMMARY" 2>&1
      - name: 의존성 설치
        if: steps.mode.outputs.mode == 'probe'
        run: npm install --no-audit --no-fund > /dev/null 2>&1
      - name: 빌드
        if: steps.mode.outputs.mode == 'probe'
        run: npx vite build --base=./ > /dev/null 2>&1
      - name: Playwright 설치
        if: steps.mode.outputs.mode == 'probe'
        run: |
          npm i -D playwright@1.48.2 --no-audit --no-fund > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: 프로브 실행
        if: steps.mode.outputs.mode == 'probe'
        run: |
          node go/probe.mjs > go/out-log.txt 2>&1 || echo 'probe failed' >> go/out-log.txt
          {
            echo '## 프로브'
            tail -5 go/out-log.txt
            wc -c go/out/* 2>/dev/null || echo 'no out files'
            echo '### runtime.txt head'
            head -40 go/out/runtime.txt 2>/dev/null || echo 'no runtime.txt'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과 커밋
        if: steps.mode.outputs.mode == 'probe'
        run: |
          {
            echo '## 결과 커밋'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f go/out go/out-log.txt || echo 'add failed'
            git status --short | head -20
            if git diff --cached --quiet; then echo 'no staged changes'; else
              git commit -m 'i18n: 6차 러너 결과 반영 [skip ci]' || echo 'commit failed'
              git push origin HEAD:refs/heads/main 2>&1 | tail -4
              echo 'push_main_done'
              git push origin HEAD:refs/heads/go6 2>&1 | tail -4
              echo 'push_branch_done'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
