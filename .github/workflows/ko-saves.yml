name: ko-saves
on:
  push:
    paths:
      - '.github/workflows/ko-saves.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add saves copy step
        run: |
          grep -q 'cp -r saves' .github/workflows/ko-build.yml && exit 0
          perl -0pi -e 's/      - name: nojekyll/      - name: playtest saves\n        run: cp -r saves dist\/saves || true\n      - name: nojekyll/' .github/workflows/ko-build.yml
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'CI: 플레이테스트 저장 파일도 배포에 포함'
          git push
