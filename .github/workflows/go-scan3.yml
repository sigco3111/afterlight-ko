name: go-scan3
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 확인
        run: node --check go/ko3-scan.mjs
      - name: 의존성
        run: npm i --no-save --no-audit --no-fund playwright@1.47.2
      - name: 브라우저
        run: npx playwright install --with-deps chromium
      - name: 스캔
        run: node go/ko3-scan.mjs
        env:
          MODE: runtime
      - name: 결과
        if: always()
        run: ls -la go/out | head -40
