name: ko-put-ui
on:
  push:
    paths:
      - '.github/workflows/ko-put-ui.yml'
permissions:
  contents: write
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write part
        run: |
          mkdir -p i18n/parts
          echo '' | base64 -d > i18n/parts/ui.json
          node tools/merge-ko.mjs
          git config user.name afterlight-ko
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'i18n: UI 문자열 사전(parts/ui.json)'
          git push
