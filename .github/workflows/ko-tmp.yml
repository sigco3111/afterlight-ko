           "Blue *◆* markers show where side quests lead: over people and places, on the minimap and on the world map. Settings → Side Quest Markers turns them off.": "파란 *◆* 표식은 서브 퀘스트가 향하는 곳을 보여 준다. 사람과 장소 위, 미니맵, 월드맵에 표시된다. 설정 → 서브 퀘스트 표시에서 끌 수 있다.",
           "Riding Kindle": "킨들 타기",
