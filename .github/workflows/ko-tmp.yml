           "Hunt it now, or leave it be and come back stronger. Tell Greer when you fell one: she pays for every mark.": "지금 사냥하거나, 그냥 두고 나중에 더 강해져서 돌아와라. 하나를 쓰러뜨리면 그리어에게 알려라. 마크마다 대금을 치른다.",
