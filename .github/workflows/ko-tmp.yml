          {
           "\"Eat something green once a week.\"": "\"일주일에 한 번은 초록색을 먹어라.\"",
           "\"One Crest, one life\" is a lie. A comfortable one. It keeps farmers farming and soldiers soldiering, and nobody asking awkward questions in the Cathedral.": "\"크레스트 하나, 인생 하나\"는 거짓말이다. 편안한 거짓말. 농부는 농부로, 병사는 병사로 남게 하고, 성당에서 어색한 질문을 아무도 하지 않게 만든다.",
           "\"Send the coward to the edge of the world,\" he said. \"Somewhere he can't get anyone else killed.\"": "\"겁쟁이는 세상 끝으로 보내라\"고 그가 말했다. \"다른 누구도 죽게 만들 수 없는 곳으로.\"",
           "\"Tam is a genius.\"": "\"탐은 천재야.\"",
           "\"The girl is to be detained and conveyed to the Cathedral of Dawn. Unharmed. By order of the Lord-Commander, Garrick Thorne.\"": "\"그 소녀는 붙잡아 새벽의 대성당으로 이송한다. 상해 없이. 사령관 게릭 쏜의 명령이다.\"",
           "\"The red sky sleeps.\"": "\"붉은 하늘이 잠들었어.\"",
           "\"The red sky sleeps.\" Remember that. Or I will. I'll remember it for you.": "\"붉은 하늘이 잠들었어.\" 그거 기억해. 아니면 내가 기억할게. 내가 널 대신 기억해 줄게.",
           "\"The red sky weeps.\"": "\"붉은 하늘이 울어.\"",
           "\"Weeps\" was last week. This week it's \"the red sky sleeps.\"": "\"운다\"는 지난주 거야. 이번 주는 \"붉은 하늘이 잠들었어.\"",
           "'Cause you told your mum, Nib.": "니브, 네가 엄마한테 말했잖아.",
           "*MERIBEL ASH. SEVEN SUMMERS.*": "*메리벨 애시. 일곱 번의 여름.*",
           "*SHE WENT TO PLAY IN THE WOLD.*": "*그녀는 숲에서 놀러 갔다.*",
           "*SPEAK TO US IN THE ORDER OF A LIFE, AND THE WOLD WILL LET YOU PASS.*": "*한 생애의 순서대로 우리에게 말하라. 그러면 숲이 너를 지나가게 하리라.*",
           "*WE ARE BORN. WE ARE BOUND. WE ARE BURIED.*": "*우리는 태어난다. 우리는 묶인다. 우리는 묻힌다.*",
           "A Crest? At her age? Oh, you'll want Old Bethan for that. The cottage up the hill, past the beehives. She knows Crests better than any priest.": "크레스트? 그 나이에? 그럼 늙은 베탄을 찾아가야지. 언덕 위 오두막, 벌통 지나서. 그 할머니는 어떤 사제보다 크레스트를 잘 알아.",
           "A barricade of stolen crates, barrels and one very surprised-looking hay cart. Painted on it: AURENNE ROAD — TOLL — ASK FOR TAM.": "훔친 상자와 통, 그리고 몹시 놀란 얼굴의 건초 수레로 만든 바리케이드. 그 위에 휘갈겨 썼다: 아우렌 길 — 통행료 — 탐을 찾으시오.",
           "A bronze gull spouting water. Someone has knitted it a tiny hat.": "물을 뿜는 청동 갈매기. 누군가 작은 모자를 떠서 씌워 두었다.",
           "A cairn of sea-smoothed stones, stacked with care. Someone built this to last.": "파도에 닳은 돌을 정성껏 쌓아 올린 무덤. 누군가 오래 가라고 쌓았다.",
           "A cairn of sea-smoothed stones. A gull feather has been tucked between two of them, carefully.": "파도에 닳은 돌을 쌓아 올린 무덤. 돌 사이에 갈매기 깃털 하나가 조심스레 끼워져 있다.",
           "A cat. A real cat?": "고양이다. 진짜 고양이?",
           "A cauldron of something that smells of mint, honey and righteous indignation.": "박하와 꿀, 그리고 의로운 분노 냄새가 나는 가마솥.",
           "A dense hawthorn hedge. Someone has woven it tight here, on purpose. You can smell rosemary and mint behind it.": "빽빽한 산사나무 울타리. 누군가 일부러 이곳만 단단히 엮어 놓았다. 울타리 너머로 로즈메리와 박하 냄새가 난다.",
           "A fortnight ago? Sable washed up on Lanternfall barely a _week_ ago.": "보름 전이라고? 세이블이 랜턴폴에 밀려온 건 겨우 _일주일_ 전이야.",
           "A hermit named Hesketh, who used to keep the Gull Light, fed us stew and showed us a goat path around the soldiers. He says the light tells you what you are — not what you'll do about it.": "헤스케스라는 은둔자가 있었는데, 갈매기 등대를 지키던 사람이야. 우리에게 스튜를 먹이고 병사들을 피해 가는 염소길을 알려 줬어. 그 빛은 네가 무엇인지 알려 주지, 네가 어쩌겠다는 건 아니라고 하더라.",
           "A knight who's... still loading.": "기사인데… 아직 로딩 중인.",
           "A little girl named Merry is hiding somewhere in the Whisperwold. She wants to be found.": "메리라는 어린 소녀가 위스퍼월드 어딘가에 숨어 있다. 그 애는 발견되기를 바란다.",
           "A lone tree at the edge of the overlook, its violet leaves turned toward the far-off sea.": "전망대 가장자리의 외로운 나무, 보랏빛 잎이 먼 바다를 향해 있다.",
           "A man's voice. Warm, and tired, like someone talking in his sleep.": "남자의 목소리. 따뜻하고 지친, 잠꼬대하듯.",
           "A notebook of names and Crests, in a hundred different inks. The oldest pages are dated sixty years ago. Near the middle, a single line: \"C. — the Keeper's boy. Mender, Arcanist, Cantor, Warden. Wants more. Too much more.\"": "이름과 크레스트가 적힌 공책, 백 가지의 다른 잉크로. 가장 오래된 장은 육십 년 전 날짜다. 중간쯤에 한 줄: \"C. — 수호자의 아이. 멘더, 아르카니스트, 칸토르, 워든. 더 원한다. 너무 많이 더.\"",
           "A rockfall chokes the top of an old goat path down the cliff. Far below, the cove glitters.": "절벽 아래로 내려가는 옛 염소길 위쪽이 돌사태로 막혀 있다. 저 아래에서 작은 만이 반짝인다.",
           "A sack of salted herring. The sack has teeth marks in it. The teeth marks are ginger.": "소금에 절인 청어 한 자루. 자루에 이빨 자국이 있다. 이빨 자국은 생강색이다.",
           "A scarecrow in a battered hat. Its button eyes seem to follow you. That's just a thing people say about scarecrows.\n...Isn't it?": "너덜너덜한 모자를 쓴 허수아비. 단추 눈이 당신을 따라오는 것 같다. 허수아비에 대해 사람들이 흔히 하는 말일 뿐이다.\n…그렇지?",
           "A seam of violet crystal runs through the quarry wall like a vein. It is cold enough to hurt, and it is breathing. Someone has been chipping it out by the cartload.": "채석장 벽을 혈관처럼 가로지르는 보랏빛 수정 맥. 아플 만큼 차갑고, 숨을 쉬고 있다. 누군가 수레째 캐내고 있다.",
           "A shelf of sailors' knots, tied and labeled in a careful hand. Bowline. Sheet bend. Clove hitch. The bowline has been tied and untied so many times the rope is frayed white.": "뱃사람의 매듭을 엮어 정성스러운 글씨로 이름을 붙여 둔 선반. 보울라인. 시트 벤드. 클로브 히치. 보울라인은 너무 여러 번 묶였다 풀려서 밧줄이 하얗게 닳았다.",
           "A shelf of ships in bottles. One of them is a Dawnguard frigate, built upside down. Mags says it's \"accurate\".": "병 속의 배들이 놓인 선반. 그중 하나는 거꾸로 만든 새벽수호대 프리깃이다. 매그스는 그게 \"정확하다\"고 한다.",
           "A slender tree, pale as bone. Its voice is very young.": "뼈처럼 창백한 가느다란 나무. 그 목소리는 아주 어리다.",
           "A small stone, green with moss, half-hidden in flowers that should not be blooming in autumn.": "이끼로 푸릇한 작은 돌, 가을에 피어날 리 없는 꽃들 사이에 반쯤 가려져 있다.",
           "A standing stone, warm to the touch. Voices move inside it like fish under ice.": "만지면 따뜻한 선 돌. 그 안에서 목소리들이 얼음 밑의 물고기처럼 움직인다.",
           "A tent full of stolen flour sacks, three hats, and a very confused mule.": "훔친 밀가루 자루와 모자 세 개, 그리고 몹시 혼란스러운 노새가 가득한 천막.",
           "A tree of violet glass and old bark. It hums, softly, the way a mother hums with her mouth closed.": "보랏빛 유리와 늙은 나무껍질로 된 나무. 어머니가 입을 다문 채 콧노래하듯 조용히 웅웅거린다.",
           "A voice in the trees at the overlook said \"west, always west.\" It's a common enough thing to say. It's a common enough thing to say.": "전망대의 나무들 사이에서 목소리가 말했다. \"서쪽으로, 언제나 서쪽으로.\" 흔한 말이다. 흔한 말이다.",
           "A wall of black thorns, thick as a man's wrist. Woven, almost. As if someone made it to keep something in — or keep you out.": "사람 손목만큼 굵은 검은 가시벽. 거의 엮여 있다. 누군가 무언가를 가두려 — 아니면 당신을 막으려 — 만든 것처럼.",
           "A wall of roots, twisted together like clasped hands. Behind it, violet light pulses slowly, like breathing.": "마주 잡은 손처럼 얽힌 뿌리 벽. 그 뒤에서 보랏빛 빛이 숨쉬듯 천천히 맥동한다.",
           "ADMIRAL! You fat orange traitor! Come here— no, he's gone straight back to her. Of course he has.": "제독! 이 뚱뚱한 주황색 배신자! 이리 와— 아, 벌써 저쪽으로 갔어. 당연하지.",
           "Absolutely not.": "절대 안 돼.",
           "Admiral Whiskers": "수염 제독",
           "Admiral's asleep in the herring crate. He'll be there till spring.": "제독은 청어 상자에서 자고 있다. 봄까지 거기 있을 거다.",
           "Again! Count again! Big Shiny Man counts too fast. Shawl Lady, you count.": "또! 다시 세 봐! 반짝이 아저씨는 너무 빨리 세. 숄 아줌마, 네가 세.",
           "All those years telling me there was nothing out here worth leaving for...": "그 세월 동안 여기엔 떠날 만한 게 없다고 내게 말했으면서…",
           "All three scarecrows are down. Tell Farmer Dunstan his fields are safe.": "허수아비 세 개가 다 쓰러졌다. 던스턴 농부에게 밭이 안전하다고 전해라.",
           "All three? Even Old Strawman? ...Granddad would've hated that. He'd also have hated a walking scarecrow, so. Swings and roundabouts.": "셋 다? 늙은 허수아비까지? …할아버지가 싫어하셨겠다. 걸어 다니는 허수아비도 싫어하셨을 테니. 뭐, 이래저래.",
           "Alright! Alright. Yield. I yield. Mercy. Uncle. All the good words.": "좋아! 좋아. 항복. 항복할게. 자비. 삼촌. 다 좋은 말 다 해.",
           "Also a log. I name the logs. You'd name the logs too, after twenty years up here.": "통나무도 있다. 난 통나무에 이름을 붙여. 여기서 이십 년 살면 너도 그럴 거야.",
           "An anvil, polished to a mirror. It has never once been used. \"It's for atmosphere,\" says Tolliver.": "거울처럼 닦인 모루. 한 번도 쓰인 적이 없다. \"분위기용이야\"라고 톨리버가 말한다.",
           "An inn. Inns have back doors. Every inn I've ever been thrown out of had a back door.": "여관. 여관엔 뒷문이 있지. 내가 쫓겨난 여관엔 다 뒷문이 있었어.",
           "An innkeeper named Mags hid us from Thorne's Own. Bram told us about his trial — Garrick Thorne called him a coward and sent him to Lanternfall. The soldiers said Sable is to be brought to Aurenne \"unharmed\".": "매그스라는 여관주인이 쏜의 친위대에게서 우리를 숨겨 줬다. 브람이 자기 재판 이야기를 해 줬다 — 게릭 쏜이 그를 겁쟁이라 부르고 랜턴폴로 보냈다고. 병사들은 세이블을 아우렌으로 \"상해 없이\" 데려가라고 했다.",
           "An oil lamp on the sill, burning low and steady. The glass is spotless. Someone cleans it every single day.": "창턱의 등잔, 낮게 꾸준히 타고 있다. 유리는 티 하나 없다. 누군가 매일 닦는다.",
           "An old tree with a split trunk, hollow and quiet. Fireflies drift in and out of it as if they are visiting.": "갈라진 줄기의 늙은 나무, 텅 비고 조용하다. 반딧불이 드나든다. 마치 놀러 오는 것처럼.",
           "An old well behind the inn. A bucket, a rope, and a great many wishes at the bottom, some of them probably about cider.": "여관 뒤의 옛 우물. 두레박과 밧줄, 그리고 바닥에 아주 많은 소원들, 그중엔 사과주에 관한 것도 있겠지.",
           "And Pugilist at sixty-one, because a man in Aurenne told me I was too old to learn anything.": "그리고 예순한 살의 퓨질리스트. 아우렌의 어떤 남자가 내가 배우기엔 너무 늙었다고 했거든.",
           "And a gift. Cantor — the singer's Crest. Songs that steady the heart. I learned it at forty to annoy that bishop. It'll suit at least one of you.": "그리고 선물. 칸토르 — 노래하는 자의 크레스트. 마음을 진정시키는 노래. 그 주교를 골려 주려고 마흔에 배웠지. 너희 중 적어도 하나에겐 맞을 거야.",
           "And here's the bit the Choir hates: a Support you've learned is yours forever. Learn to counter as a Pugilist and you'll still counter as a Mender. Your *Support Points* decide how many knacks you can carry.": "그리고 성가대가 싫어하는 부분: 배운 지원은 영원히 네 것이다. 퓨질리스트로 반격을 배우면 멘더로도 반격한다. *지원 포인트*가 몇 개를 지닐지 정한다.",
           "And if anyone can talk sense into Red Tam, it's her. He's terrified of her. So am I.": "그리고 붉은 탐을 설득할 사람이 있다면 그 애다. 탐은 그 애를 무서워한다. 나도 그렇고.",
           "And the Whisperwold's talking louder this year. Louder than I've ever heard it. Make of that what you like. I make nothing of it. I'm in commerce.": "그리고 위스퍼월드가 올해 더 크게 말하고 있어. 내가 들어 본 것 중 가장 크게. 어떻게 해석하든 자유야. 난 아무것도 안 해. 난 장사꾼이니까.",
           "And the archer on the ridge says the rest. Back, Wren.": "그리고 능선 위의 궁수가 나머지를 말해 준다. 물러서, 렌.",
           "And then she is only a tree: very old, very tired, and quiet at last.": "그리고 나서 그녀는 그저 나무일 뿐이다. 아주 늙고, 아주 지쳤고, 마침내 조용하다.",
           "And they came back down again without a single bandit in chains. You tell me what that means. I know what it means. I want to hear you say it.": "그리고 그들은 사슬에 묶인 산적 하나 없이 다시 내려왔다. 그게 무슨 뜻인지 네가 말해 봐. 나는 안다. 네 입으로 듣고 싶어.",
           "And when tin-cans come asking after a frightened girl and won't say what she did — she didn't do anything. That's what that means.": "그리고 양철통들이 겁먹은 소녀를 찾아와서 무슨 짓을 했는지 말도 안 할 때 — 그 애는 아무것도 안 했어. 그게 그 뜻이야.",
           "And you. Come here, child. Give me that hand.": "그리고 너. 이리 오렴, 아이야. 그 손을 내밀어 봐.",
           "Answer it": "응답한다",
           "Answer the voice?": "그 목소리에 응답할까?",
           "Answer what?": "뭐에 응답해?",
           "Are you a knight? You look like a knight.": "기사야? 기사처럼 보여.",
           "Are you— the Reeve said you're the Crestless Sage?": "혹시— 촌장이 말했어, 네가 크레스트 없는 현자라고?",
           "Ask Bethan for another sparring match?": "베탄에게 또 대련을 청할까?",
           "Asking's free. Answers cost a log-name.": "묻는 건 공짜야. 답은 통나무 이름 하나쯤 치러야지.",
           "At the heart of the wold stands a tree so old it has forgotten it is a tree.": "숲 한가운데엔 자기가 나무라는 걸 잊은 듯한 아주 오래된 나무가 서 있다.",
           "Auntie Prue": "프루 아줌마",
           "Aurenne. Two days east. Then the Cathedral. Then answers.": "아우렌. 동쪽으로 이틀. 그다음 성당. 그다음 답.",
           "BY ORDER OF THE LORD-COMMANDER: any person sheltering a girl of about sixteen years, black hair, pale complexion, is to report to the Dawnguard. REWARD.\n\nBelow it: LOST — GINGER CAT. ANSWERS TO \"ADMIRAL\". (DOES NOT ANSWER.) — Bettany, Fish Market.": "사령관의 명령: 검은 머리에 창백한 얼굴의 열여섯 살쯤 된 소녀를 숨겨 주는 자는 누구든 새벽수호대에 신고하라. 현상금.\n\n아래에: 실종 — 생강색 고양이. \"제독\"이라고 부르면 응답함. (응답하지 않음.) — 베터니, 어시장.",
           "Back again? Sit by the fire a while. Agatha's free.": "또 왔어? 불가에서 좀 앉아. 아가테는 공짜야.",
           "Back already? Pedrick sells Crest Stones. Try a few on. Wear them like hats.": "벌써 돌아왔어? 페드릭은 크레스트 스톤을 팔아. 몇 개 써 봐. 모자처럼.",
           "Bed, bath and a bowl of chowder. Thirty gold. Fugitives pay in advance.": "침대, 목욕, 그리고 차우더 한 그릇. 금화 서른 닢. 도망자는 선불이야.",
           "Beds are straw, pillows are feathers, soup is mostly turnip. Forty gold. Breakfast is whatever the cat didn't eat.": "침대는 짚, 베개는 깃털, 수프는 대부분 순무. 금화 마흔 닢. 아침은 고양이가 안 먹은 거.",
           "Beehives, humming. One bee lands on your hand, considers you thoroughly, and leaves unimpressed.": "벌통이 웅웅거린다. 벌 한 마리가 네 손에 앉아 너를 꼼꼼히 살피고는 실망한 듯 날아간다.",
           "Been waiting nine days. The wind's stubborn this year. Like it's waiting on something too.": "아흐레째 기다리는 중이야. 올해 바람이 고집스러워. 바람도 뭘 기다리는 것처럼.",
           "Bees are out again. Singing. They knew before I did — they always know.": "벌들이 다시 나왔어. 노래하고 있어. 나보다 먼저 알았어 — 걔들은 늘 알아.",
           "Before the rocks. Before Lanternfall. I was in the water, and the water was full of voices like these. All talking. None of them listening.": "바위 전에. 랜턴폴 전에. 나는 물속에 있었고, 물은 이런 목소리로 가득했어. 다들 말하고 있었지. 아무도 듣지 않았고.",
           "Behind the barrel, wedged into a gap no cat should fit, is a great deal of ginger cat. One ear points at heaven.": "통 뒤에, 고양이가 들어갈 리 없는 틈에 엄청난 양의 생강색 고양이가 끼어 있다. 한쪽 귀가 하늘을 향한다.",
           "Behind the barrel: a dent in the dust the exact shape of a smug cat.": "통 뒤: 뿌듯한 고양이 모양 그대로 먼지에 움푹 팬 자국.",
           "Bethan sent you after Tam? Of course she did. She sends everyone after something.": "베탄이 너를 탐에게 보냈지? 당연하지. 걔는 누구든 뭔가에게 보내.",
           "Bethan taught you, then? ...Forty years I've been a Vanguard who weaves. Maybe I'll go up the hill tomorrow.": "그럼 베탄에게 배웠어? …사십 년 동안 나는 직조하는 뱅가드였어. 내일 언덕에 올라가 볼까.",
           "Bethan's herb path? Pulled the hedge back myself. Far east end of the fields, then up the hill.": "베탄의 약초길? 울타리는 내가 직접 걷어냈어. 들판 동쪽 끝에서 언덕으로.",
           "Bethan's mad. ...I think about it, though.": "베탄은 미쳤어. …그래도 생각은 해 봐.",
           "Bethan, the Crestless Sage, has FIVE Crests. She says \"one Crest, one life\" is a lie, and taught us to braid our Crests. She once taught a Keeper's son who lost someone young. She wonders if she made a monster.": "크레스트 없는 현자 베탄에게는 크레스트가 다섯 개 있다. 그녀는 \"크레스트 하나, 인생 하나\"는 거짓말이라 하고, 우리에게 크레스트를 엮는 법을 가르쳤다. 어린 나이에 누군가를 잃은 수호자의 아들에게도 가르친 적이 있다. 그녀는 자기가 괴물을 만들었나 궁금해한다.",
           "Bethan... why did the Choir really throw you out?": "베탄… 성가대가 왜 널 정말 내쫓은 거야?",
           "Bettany's ginger tom fled when the soldiers searched the fish market. Somewhere dark, near fish...": "베터니의 생강색 수고양이는 병사들이 어시장을 수색할 때 달아났다. 어둡고 물고기 냄새 나는 어딘가로…",
           "Better. Not good. Better.": "나아졌어. 좋지는 않고. 나아졌어.",
           "Big Hollis": "덩치 홀리스",
           "Big Shiny— I— One. Two. Three...": "반짝이 아저씨— 난— 하나. 둘. 셋…",
           "Black hair! Lieutenant! LIEUTENANT, IT'S HER—": "검은 머리! 중위님! 중위님, 이 애예요—",
           "Black-sailed cutter tied up at my pier four days ago. No harbor fee. No manifest. \"Dawnguard business.\"": "검은 돛의 커터가 나흘 전 내 부두에 대어 있었어. 정박료도 없고, 선원 명부도 없고. \"새벽수호대 일이다.\"",
           "Books the Choir tried to burn. Some of them are singed at the edges. One is titled _On the Braiding of Callings, and Why the Cathedral Is Wrong About Everything_.": "성가대가 불태우려 한 책들. 일부는 가장자리가 그을려 있다. 하나는 제목이 _소명을 엮는 법, 그리고 왜 대성당이 모든 것에 대해 틀렸는가_.",
           "Bought new stuffing for 'em off some lads on the road. Two silver a sack. Purple, it was. Glittery. Swore it'd keep the crows off for good.": "길에서 만난 녀석들에게 새 속을 사다 넣었어. 한 자루에 은화 두 닢. 보라색이더라. 반짝반짝. 까마귀를 영영 쫓아낼 거라고 맹세했지.",
           "Bram hasn't said a word in an hour. Is that a record? We should write it down.": "브람이 한 시간째 한마디도 안 했어. 기록인가? 적어 둬야겠다.",
           "Bram. You know them. Thorne's Own.": "브람. 너도 알잖아. 쏜의 친위대.",
           "Brother Anselm": "안셀름 수사",
           "Brother? ...Brother, I can't find the door. It's so dark.": "수사님? …수사님, 문을 못 찾겠어요. 너무 어두워요.",
           "But _how_?": "그런데 _어떻게_?",
           "But the Hierophant says something wonderful is coming. A dawn like no other. I believe him. I've always believed him.": "하지만 교황께서 멋진 것이 온다고 하셨어. 아무것도 닮지 않은 새벽이. 나는 그분을 믿어. 늘 믿어 왔어.",
           "By the black pond, a crooked tree with a split like a grin. Something in it laughs — a wheezing, honking laugh, like a seal choking on a herring.": "검은 연못 옆, 웃는 듯 갈라진 비뚤어진 나무. 그 안에서 뭔가 웃는다 — 청어에 목이 막힌 물범처럼 쌕쌕거리는 웃음.",
           "Bye, Big Shiny Man. Bye, Grumpy— I mean, bye, Ilse. Bye, Wren.": "잘 있어, 반짝이 아저씨. 잘 있어, 심술— 아니, 잘 있어, 일세. 잘 있어, 렌.",
           "Bye, Sable. Don't let anybody keep you.": "잘 있어, 세이블. 아무한테도 붙잡히지 마.",
           "Carved their letters in the mooring post at the end of the long pier. Go and see, if you don't believe an old net-mender.": "긴 부두 끝 정박 기둥에 글자를 새겼어. 늙은 그물 수선공 말이 못 믿겠으면 가서 봐.",
           "Cheerful, isn't it? Everyone requests it. Nobody knows why.": "명랑하지? 다들 이걸 주문해. 이유는 아무도 몰라.",
           "City of Bells": "종의 도시",
           "Coast road's east, through the gate. If you see any black-trim soldiers on it, I didn't say this, but: go round.": "해안길은 동쪽, 성문 지나서. 그 길에서 검은 테두리 병사들을 보면, 내가 이런 말 안 했지만: 돌아가.",
           "Corporal Fen": "펜 상병",
           "Course you did, herb-girl. That's your loudest thing. Doesn't mean it's your _only_ thing.": "그랬겠지, 약초 아가씨. 그게 네 제일 큰 소리야. 그게 네 _유일한_ 소리라는 뜻은 아니지.",
           "Crest Stones! Bethan sent you, didn't she. Six hundred apiece — they're old Lantern-glass, mind. Each one remembers a calling.": "크레스트 스톤! 베탄이 보냈지, 그렇지. 하나에 육백 닢 — 옛 랜턴 유리라서 말이야. 하나하나가 소명을 기억해.",
           "Crestless. Ha.": "크레스트도 없다니. 하!",
           "Danced till dawn on the pier, the pair of them, to a fiddler who only knew one song. Then she went home and never came back across.": "둘이 부두에서 새벽까지 춤을 췄어. 한 곡밖에 모르는 바이올린쟁이에게 맞춰서. 그러다 그녀는 집에 돌아갔고, 다시는 건너오지 않았지.",
           "Dawn's blessing on you, travelers. The shrine is closed, I'm afraid — the Cathedral has recalled all the lamp-oil for \"the harmonizing\". Whatever that is.": "여행자들이여, 새벽의 축복이 있기를. 성당은 문을 닫았소. \"조화\"를 위해 대성당이 등유를 전부 거둬 갔거든. 그게 무슨 뜻인지는 모르겠지만.",
           "Dawn's blessing on your road.": "그대의 길에도 새벽의 축복이 있기를.",
           "Deckhand Nell": "갑판원 넬",
           "Did you see 'em? The black-trim lot? Tipped over every crate on the quay looking for one girl.": "봤어? 검은 테두리 부대? 한 소녀를 찾느라 부두의 짐칸을 전부 뒤엎었어.",
           "Did you watch? Every few breaths I was something different. Mender. Arcanist. Pugilist. Same old woman. Different _tools_.": "봤어? 숨 몇 번 쉴 때마다 나는 다른 게 됐어. 멘더. 아르카니스트. 퓨질리스트. 같은 할멈인데. 도구가 다르지.",
           "Didn't say. Didn't have to. They came down the quarry track with it. Tam's lot, the thieving—": "말 안 했어. 말할 필요도 없었지. 그들이 채석장 길로 그걸 가져왔거든. 탐의 무리, 그 도둑놈들—",
           "Do you want to play? Nobody plays anymore. They only talk and talk and talk.": "같이 놀래? 이제 아무도 안 놀아. 말만 하고 또 하고 또 하지.",
           "Don't _say_ that. Not in a haunted forest. Not out loud.": "그런 말 하지 마. 유령 숲에서는 안 돼. 소리 내서는.",
           "Don't go in the fields. I mean it. Not the north field, not the south field, not the field I haven't named yet.": "들판엔 가지 마. 진심이야. 북쪽 들판도, 남쪽 들판도, 아직 이름 못 붙인 들판도.",
           "Don't look so worried. I hate soldiers. They turned back a tinker yesterday for having a dark-haired daughter. Made the child cry. Nasty business.": "그렇게 걱정하지 마. 난 병사가 싫어. 어제는 검은 머리 딸이 있다는 이유로 땜장이를 돌려보냈어. 아이가 울었다고. 더러운 짓이야.",
           "Don't tell Mother. She doesn't like me going there. She says it makes me sad.": "어머니한테는 말하지 마. 내가 거기 가는 걸 싫어해. 그러면 내가 슬퍼진다고 하셔.",
           "Don't. Don't think about it. Walk.": "아니. 그 생각은 하지 마. 그냥 걸어.",
           "Don't. He's the one who _sent_ us. If Thorne wants her too, it's because— I don't know. Because something's gone wrong. Because someone's lying to him.": "아니. 그 사람이 우리를 _보낸_ 사람이야. 쏜이 그 애를 원한다면, 그건… 모르겠어. 뭔가 잘못됐기 때문이겠지. 누군가 그에게 거짓말을 하고 있는 거야.",
           "Door was open, so you came in. That's either brave or rude. Sit. Both is fine.": "문이 열려 있어서 들어왔구나. 용감한 건지 무례한 건지. 앉아. 둘 다여도 괜찮아.",
           "Dunstan says I was drunk. I _was_ drunk. It still moved.": "던스턴은 내가 취했다고 해. 취했었지. 그래도 움직였어.",
           "Dunstan — the lads who sold you that stuffing. Where did they say it came from?": "던스턴 — 너한테 그 솜을 판 녀석들 말이야. 어디서 났다고 했어?",
           "E.H. + Y. She never told me. She never told me _anything_.": "E.H. + Y. 그녀는 나한테 한 번도 말하지 않았어. 아무것도 말해 준 적이 없어.",
           "E.H.... Somebody was happy here, once.": "E.H.… 여기서 한때 누군가 행복했었지.",
           "EAST — AURENNE, 2 days.\nNORTH — THE OLD QUARRY (CLOSED. BY ORDER OF RED TAM. SIGNED, RED TAM.)\nWEST — THISTLEDOWN.": "동쪽 — 아우렌, 이틀.\n북쪽 — 옛 채석장 (폐쇄. 붉은 탐의 명령. 서명, 붉은 탐.)\n서쪽 — 시슬다운.",
           "Edrin Halloway. And Y. She came here. She stood right here.": "에드린 할러웨이. 그리고 Y. 그녀가 여기 왔었어. 바로 여기 서 있었지.",
           "Every Crest grows on its own as you fight with it. Each rank teaches you an Art — or a *Support*. A habit. A knack.": "크레스트는 싸울수록 저절로 자란다. 랭크마다 기술이나 *지원*을 가르쳐 준다. 습관이고, 요령이지.",
           "Every loaf I make catches fire. The Choir says I'm \"fighting my calling\". I say I'm making toast.": "내가 만든 빵은 전부 불이 붙어. 성가대는 내가 \"내 소명과 싸우고 있다\"고 하지. 난 토스트를 만들고 있다고 말해.",
           "Every mother in Solmere sings that.": "솔미어의 엄마들은 전부 그 노래를 불러.",
           "Everything's for sale, girl. That's the first thing the road teaches you. The second thing is: duck.": "여기선 다 팔아, 아가씨. 길이 가르쳐 주는 첫 번째 교훈이야. 두 번째는: 피해.",
           "Explore Port Gale, then take the coast road east toward the Whisperwold.": "포트 게일을 둘러본 뒤, 해안길을 따라 동쪽 위스퍼월드로 가라.",
           "Far off — so faint it might be imagined — the evening wind carries the sound of bells.": "멀리서 — 상상일 만큼 희미하게 — 저녁 바람이 종소리를 실어 온다.",
           "Far off, deep in the wold, something old and wooden groans — and moves.": "멀리, 숲 깊은 곳에서 오래된 나무가 신음하며 — 움직인다.",
           "Farmer Dunstan": "던스턴 농부",
           "Farmer Dunstan's scarecrows have come alive after he stuffed them with cheap purple \"stuffing\". Put down the three in the east fields — Old Strawman last.": "던스턴 농부의 허수아비들이 싸구려 보라색 \"솜\"을 채워 넣은 뒤 살아 움직이기 시작했다. 동쪽 들판의 허수아비 셋을 쓰러뜨려라 — 늙은 짚인형을 마지막에.",
           "Farmhand Wat": "일꾼 왓",
           "Fields are east. Quarry's north of the fields. Tam's lads shoot at anything climbing the track. Don't.": "들판은 동쪽이야. 채석장은 들판 북쪽이고. 탐의 부하들이 길을 오르는 자는 누구든 쏴. 가지 마.",
           "Fields are quiet. Crows are back. I've never been so glad to see crows.": "들판은 조용해. 까마귀들이 돌아왔어. 까마귀를 보고 이렇게 반가웠던 적은 없어.",
           "Find a way through the Whisperwold. (Mags said: don't answer the trees.)": "위스퍼월드를 뚫고 갈 길을 찾아라. (매그스가 말했지: 나무의 말에 대답하지 마.)",
           "Find the three Listening Stones and answer them in the order of a life.": "듣는 돌 세 개를 찾아서, 한 생애의 순서대로 대답하라.",
           "Follow the Gale Coast Road east toward the Whisperwold.": "해안길을 따라 동쪽, 위스퍼월드로 가라.",
           "For the record, the alley is _still_ west of the pier.": "참고로, 그 골목은 여전히 부두 서쪽에 있어.",
           "Found him behind the barrels. Return the Admiral to Bettany at the fish market.": "통 뒤에서 찾았어. 제독을 어시장의 베터니에게 돌려줘.",
           "Found me! ...Did you hear it? It's so quiet now. Mother's gone quiet.": "찾았다! …들었어? 지금은 너무 조용해. 어머니가 조용해지셨어.",
           "Found me! This is where Mother sings. I like it here best.": "찾았다! 여기가 어머니가 노래하시는 곳이야. 여기가 제일 좋아.",
           "Fresh cod! Fresh-ish haddock! Oh — sorry, love, you don't look like you're buying. You look like you're looking.": "싱싱한 대구! 싱싱한 해덕! 아, 미안해, 아가씨, 사러 온 얼굴이 아니네. 구경하러 온 얼굴이야.",
           "Friends get the acorn. It's the key to my secret place. Past the thorns, by the stones.": "친구에게는 도토리를 준다. 내 비밀 장소의 열쇠야. 가시나무 너머, 돌들 옆.",
           "Ginger. Fat. One ear that points at heaven. Answers to \"Admiral\", in the sense that he doesn't.": "생강색. 뚱뚱하고. 하늘을 가리키는 귀 한쪽. \"제독\"이라고 부르면 대답하지 — 대답하지 않는다는 뜻에서.",
           "Gloamweaver. Whatever's waiting for you in Aurenne — you're more than one thing. Remember it, the day somebody tells you otherwise.": "어둑빛 직조자. 아우렌에서 무엇이 널 기다리든, 넌 하나 이상의 존재야. 누군가 그게 아니라고 말하는 날, 그걸 기억해.",
           "Go on to Aurenne. And when somebody in a fine robe tells you what you are — you remember an old woman with five Crests and a bad hip.": "아우렌으로 가라. 그리고 고운 옷을 입은 누군가가 네가 무엇인지 말해 주거든 — 크레스트 다섯 개와 나쁜 엉덩이를 가진 할머니를 떠올려.",
           "Go with the light.": "빛과 함께 가라.",
           "Good girl. And eat something. You're all elbows.": "착하구나. 그리고 뭐라도 먹어. 팔꿈치만 남았잖아.",
           "Goodbye, Admiral. I will think about you when it rains.": "잘 가, 제독. 비 오는 날이면 널 생각할게.",
           "Goodbye, Tobias. Thank you for the boat. And for not letting the snake eat us.": "잘 가, 토비아스. 배 고마워. 그리고 뱀이 우릴 잡아먹지 않게 해 줘서.",
           "Goodwife Hester": "구두장이 헤스터 부인",
           "Gulls? Gossip? Lanternfall gossip could cross an ocean.": "갈매기? 소문? 랜턴폴의 소문이라면 바다도 건널 수 있지.",
           "HALT! You — the girl in the shawl. Lower the hood.": "멈춰! 너, 숄 두른 소녀. 두건 내려.",
           "Ha! Not bad. Not bad at all. You hit like a Dawnguard squire. Which one of you's the Dawnguard squire? ...Ah. That explains a great deal.": "하! 나쁘지 않아. 전혀 나쁘지 않아. 새벽수호대 시종처럼 치는군. 그럼 너희 중 누가 새벽수호대 시종이야? …아. 그럼 많은 게 설명되네.",
           "Ha! That was mostly you lot. ...Strange girl. Good girl.": "하! 그건 대부분 너희 패거리 덕이었어. …이상한 아이. 좋은 아이.",
           "Hah! Visitors! Real ones, not gulls. Sit, sit — no, not on Agatha, she's a log. Sit on Bartholomew.": "하! 방문객! 진짜 방문객이야, 갈매기 말고. 앉아, 앉아 — 아가사 위는 안 돼, 그건 통나무야. 바살로뮤 위에 앉아.",
           "Halloway, did you say? Red hair, Lanternfall accent... You're Edrin's girl.": "할러웨이라고 했어? 빨간 머리, 랜턴폴 억양… 에드린의 딸이구나.",
           "Halt. Password.": "멈춰. 암호.",
           "Harbormaster Quill": "항만청장 퀼",
           "Harborside Outfitters": "항구변 용품점",
           "Harborside Outfitters! Swords, mail, rope, and remedies. The soldiers closed me for a whole day. A whole day! Buy something. Buy two things.": "항구변 용품점! 검, 갑옷, 밧줄, 약품. 병사들이 하루 종일 가게를 닫게 했어. 하루 종일! 뭐든 사. 두 개라도 사.",
           "Have you seen the Admiral? He's ginger. He's Bettany's. He hates me. I love him.": "제독 못 봤어? 생강색이야. 베터니 거야. 날 싫어해. 난 그 애를 사랑해.",
           "He asked if the lamp was still lit. He said— he said the knot was his fault. That you should sell the boat. That you should sleep.": "그가 등불이 아직 켜져 있냐고 물었어. 그는— 매듭이 자기 잘못이라고 했어. 배를 팔라고. 그리고 자라고.",
           "He brought a girl over from the island, that summer. Braid down to here. Never said two words to me.": "그 여름, 섬에서 한 소녀를 데려왔어. 머리를 여기까지 땋았지. 나한테는 한마디도 안 했어.",
           "He grew up. That's what happens to boys. Mostly.": "그는 자랐어. 소년들은 다 그래. 대개는.",
           "He has a very carrying voice. Somebody stop his voice.": "목소리가 아주 멀리까지 가. 누가 그 목소리 좀 멈춰.",
           "He is warm. He is... vibrating. Wren, is he broken?": "따뜻해. 진동하고 있어… 렌, 고장 난 거야?",
           "He learned every Crest I could give him, and wanted more. The Choir said I'd made a monster. I said I'd made a boy who could _do_ things.": "내가 줄 수 있는 크레스트는 전부 배웠고, 더 원했어. 성가대는 내가 괴물을 만들었다고 했지. 난 뭐든 *해낼 수 있는* 소년을 만들었다고 말했지.",
           "He likes dark places near fish. This whole town is a dark place near fish. Good luck.": "그 애는 생선 근처의 어두운 곳을 좋아해. 이 마을 전체가 생선 근처의 어두운 곳이야. 행운을 빌어.",
           "He said he cannot climb the stairs. But someone trims the wick.": "계단은 못 올라간다고 해. 그런데 누군가 심지를 다듬어 놓았어.",
           "He says he would like to stay with me.": "나랑 함께 있고 싶대.",
           "He says that to everyone with a lap, love. Here — for your trouble. And take a bit of smoked eel. No, take it. It's good for the hair.": "무릎 있는 사람한테는 다 그래, 얘야. 자, 수고비. 훈제 장어도 좀 가져가. 아니, 가져가. 머리에 좋아.",
           "He was wrong. I showed him how wrong. Twice.": "그가 틀렸어. 얼마나 틀렸는지 보여 줬어. 두 번.",
           "Herb path's behind the hedge at the east end of the fields. Mind Tam's archers.": "약초길은 들판 동쪽 끝의 울타리 뒤에 있어. 탐의 궁수 조심해.",
           "Here's how it works. I'll say it once, because I'm old and you're young and one of us has to save breath.": "방법은 이래. 한 번만 말할게. 난 늙었고 넌 어리니까, 누군가는 숨을 아껴야 하거든.",
           "Here, Admiral. Here, puss. Nice puss. Come out and— OW.": "여기, 제독. 여기, 야옹이. 착한 야옹이. 나와서— 아야!",
           "Here. For the road. Don't tell her I'm paying you in medicine again.": "여기. 길에서 써. 또 약으로 돈 받는다고 그 애한테는 말하지 마.",
           "Here. My bracelet. Mother made it out of moss. It keeps you warm when you're hurt. I won't need it where I'm going.": "여기. 내 팔찌야. 어머니가 이끼로 만드셨어. 다쳤을 때 따뜻하게 해 줘. 내가 갈 곳에선 필요 없을 거야.",
           "Here. Take one of the horseshoes off the door. I've three. Clearly they weren't working.": "여기, 문에 달린 말발굽 하나 가져가. 세 개 있는데. 분명 효과가 없었나 봐.",
           "Hesketh buried his late wife's ring under the third cairn on the cove, west of the goat path. He wants someone to wear it in the light.": "헤스케스는 만 셋째 돌무더기 밑, 염소길 서쪽에 아내의 반지를 묻었어. 누군가 빛 속에서 끼워 주길 바라고 있어.",
           "Hesketh. I kept the Gull Light, down there on the point. Oil lamp, not a proper Lantern — no Dawnstone, no Kindling. Just a big lamp to keep ships off the Teeth.": "헤스케스야. 난 저 아래 곶에서 갈매기 등대를 지켰어. 기름 등잔이야, 제대로 된 랜턴이 아니지 — 새벽석도, 점화식도 없어. 배들이 이빨 암초에 못 가까이 오게 하는 큰 등불이었지.",
           "Hey. Redhead. A girl worth more than a valley. Ask yourself why. And ask yourself who's _really_ paying.": "이봐. 빨간 머리. 계곡 하나보다 가치 있는 소녀야. 왜인지 생각해 봐. 그리고 누가 _진짜로_ 돈을 내는지도 생각해 봐.",
           "Hide and Seek": "숨바꼭질",
           "Hide-and-seek! I hide, you seek. Count to ten! No peeking, Big Shiny Man.": "숨바꼭질! 내가 숨고, 네가 찾는 거야. 열까지 세! 엿보기 금지, 반짝이 아저씨.",
           "His lads watch the quarry track. But there's an herb path behind the hedge at the far east end of the fields — up the hill to the quarry's back door. I've used it forty years.": "그의 부하들이 채석장 길을 감시해. 하지만 들판 맨 동쪽 끝 울타리 뒤에 약초길이 있어 — 언덕을 올라 채석장 뒷문까지. 난 사십 년 동안 써 왔어.",
           "Hold the line! Hold the— why aren't you holding the LINE—": "선을 지켜! 선을— 왜 선을 안 지키는 거야—",
           "Home is cold. Home is gone. I keep them warm.": "집은 춥고. 집은 사라졌어. 난 그들을 따뜻하게 해 주고 있어.",
           "How does he know she came ashore on Lanternfall? It's been four days. Nobody's crossed the strait but us.": "그녀가 랜턴폴에 상륙했다는 걸 어떻게 알지? 벌써 나흘이야. 해협을 건넌 건 우리뿐인데.",
           "Hush now, little one, the lantern's lit... the sea's asleep, and so must you...": "쉿, 아가야, 등불이 켜져 있단다… 바다가 잠들었으니, 너도 자야지…",
           "Hush. Hush, little ones. More travelers. More voices.": "쉿. 쉿, 아가들아. 또 여행자들이구나. 또 목소리들이.",
           "I KNOW there's no wind, Ilse.": "바람이 없는 건 나도 알아, 일세.",
           "I always liked autumn better anyway. The leaves go all colors, like they can't decide what to be.": "어쨌든 난 가을이 더 좋아. 잎들이 온갖 색으로 물들잖아, 마치 무엇이 될지 정하지 못한 것처럼.",
           "I always said Tam would come to a bad end. I said it about everyone, so I was bound to be right eventually.": "탐은 언젠가 나쁜 꼴을 당할 거라고 항상 말했어. 모두에게 그렇게 말했으니, 언젠가는 맞을 수밖에 없었지.",
           "I am _saluting_ the rail. It served with honor.": "난 난간에 _경례_ 하는 중이야. 명예롭게 복무했으니까.",
           "I am not yours.": "난 네 것이 아니야.",
           "I could walk this road for a year.": "이 길을 일 년이라도 걸을 수 있어.",
           "I do not know whose I am. But I am not yours.": "난 누구의 것인지 몰라. 하지만 네 것은 아니야.",
           "I do not know.": "모르겠어.",
           "I do not know. But I wanted to answer her.": "모르겠어. 하지만 그녀에게 대답하고 싶었어.",
           "I do not understand. But thank you.": "이해 못 하겠어. 하지만 고마워.",
           "I don't think I need it anymore.": "이제 그게 필요 없을 것 같아.",
           "I feed the gulls. They don't thank me. Gulls never thank you. That's why I like them. No obligations.": "난 갈매기들한테 먹이를 줘. 고맙다는 말은 안 해. 갈매기는 절대 고마워하지 않아. 그래서 좋아. 의무가 없거든.",
           "I had a plan for that too. It was \"away\".": "그것도 계획이 있었어. \"떠나기\"였지.",
           "I know your voice. You are made of the same dark as my little ones. You are one of mine. Come home.": "네 목소리 알아. 너는 내 아이들과 같은 어둠으로 만들어졌어. 너도 내 아이야. 집으로 와.",
           "I never said any of that. I'm mending a net.": "난 그런 말 한 적 없어. 그물을 깁고 있었거든.",
           "I ran rum past the Dawnguard for twenty years, pet. Habits.": "이십 년 동안 자네 같은 아가씨들 몰래 럼주를 날랐어. 버릇이야.",
           "I sang every day of my life until I was sixteen. Then the light said Warden...": "열여섯 살까지 매일 노래를 불렀어. 그다음에 빛이 수호자라고 했지…",
           "I taught a boy, once. In Aurenne. A Keeper's son. Clever, sad thing — he'd lost someone young, and couldn't bear to be helpless ever again.": "한 소년을 가르쳤던 적이 있어. 아우렌에서. 수호자의 아들이었지. 똑똑하고 슬픈 아이였어 — 어린 나이에 누군가를 잃고, 다시는 무력해지는 걸 견디지 못했어.",
           "I think... I think I can go home now. Is it still summer, out there?": "이제 집에 갈 수 있을 것 같아. 밖은 아직 여름이야?",
           "I told her the light decides. ...Maybe I'll tell her something else.": "빛이 결정한다고 그녀에게 말했어. …다른 말을 해 줄 수도 있겠지.",
           "I will remember.": "기억할게.",
           "I would like them to stop now.": "이제 그만 멈췄으면 좋겠어.",
           "I'd not say that to her face, dear. She boxes.": "얘야, 그녀 얼굴 앞에서 그런 말은 하지 마. 때릴 거야.",
           "I'm Dawnguard and Tansy's the Gloam-beast. Then we swap.": "나는 새벽수호대이고 탠지는 글룸 괴물이야. 그다음엔 바꿔.",
           "I'm going to sell the _Merry Widow_. Jory always hated that name. Said it was tempting fate.": "나 _메리 위도_ 호를 팔 거야. 조리는 그 이름 항상 싫어했어. 운명을 시험한다고.",
           "I'm not crying. It's the— wind-leaves.": "안 울어. 이건— 바람 때문에 잎이….",
           "I'm too old and too frightened to go and listen. But if you hear a man who laughs like a seal choking on a herring — tell him his sister kept the lamp lit.": "난 너무 늙었고 너무 겁이 나서 가서 듣지 못해. 하지만 청어에 목이 막힌 물범처럼 웃는 남자가 있으면 — 그의 누이가 등불을 켜 두었다고 전해 줘.",
           "I've been harbormaster thirty years. Dawnguard business used to mean pirates. Now it means asking old men about girls.": "나는 삼십 년 동안 항만청장이었어. 새벽수호대 일이라면 예전엔 해적을 뜻했지. 지금은 노인들에게 여자애에 대해 묻는 걸 뜻하고.",
           "I've been to the country. It's not that big.": "시골에도 가 봤어. 그렇게 크진 않더라.",
           "If Thorne sent his own guard all the way out here, it isn't for smugglers. It's for her. And he doesn't send them to _ask_.": "쏜이 자기 근위병을 이 먼 곳까지 보냈다면, 밀수꾼 때문이 아니야. 그 애 때문이지. 그리고 그는 _물어보려고_ 보내지 않아."
          }
          J3EOF
          git add i18n/parts/ch2a.json
          git commit -m "i18n: 2장 대사 1/3(parts/ch2a.json, 240)"
          git push
