name: ko-tmp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p .dump
          git ls-files src | xargs -I{} sh -c 'echo "{} $(wc -l < "{}")"' > .dump/list.txt
          echo "--- grep storm" >> .dump/list.txt
          grep -rl "The storm has scrubbed" src >> .dump/list.txt || true
          echo "--- ch2 files" >> .dump/list.txt
          grep -rl "c2_gale_road\|c2_wold_outer" src >> .dump/list.txt || true
          echo "--- parts" >> .dump/list.txt
          ls -la i18n/parts >> .dump/list.txt
          node tools/merge-ko.mjs >> .dump/list.txt 2>&1 || true
          wc -c src/i18n/ko.json >> .dump/list.txt || true
      - name: commit
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add -A .dump
          git commit -m "임시: 덤프(목록)" || echo none
          git push
