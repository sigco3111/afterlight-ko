name: ko6-scan
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/merge-ko.mjs > /dev/null 2>&1
      - run: node go/cand.mjs
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f go/out/cand
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'i18n: 6차 후보 목록 [skip ci]'; git push origin HEAD:refs/heads/main || echo 'push failed'; fi
