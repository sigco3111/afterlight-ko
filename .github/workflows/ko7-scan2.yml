name: ko7-scan2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 사전 병합
        run: node tools/merge-ko.mjs
      - name: 영역별 스캔
        run: node go/scan2.mjs
      - name: 커밋
        run: |
          git config user.name "ko7-bot"
          git config user.email "ko7-bot@users.noreply.github.com"
          git add go/untranslated go/scan-summary.json src/i18n/ko.json
          git diff --cached --quiet || git commit -m "i18n: 7차 영역별 미번역 스캔 [skip ci]"
          git push
