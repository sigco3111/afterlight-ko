name: ko-dump
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          echo "" | base64 -d > /tmp/dump.mjs
          node /tmp/dump.mjs
          git add -A tmp
          git commit -m "작업: 영문 문자열 덤프"
          git push origin HEAD:main
