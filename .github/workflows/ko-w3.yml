name: ko-w3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write parts
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          cat > i18n/parts/ch9a.json <<'KJSON'
          {"Corvin's Roost. A crack in a fallen mountain, too narrow for the wind to find and too ugly for the Choir to bother with.":"코르빈의 둥지. 무너진 산의 갈라진 틈, 바람도 찾기 어려울 만큼 좁고, 성가대도 손댈 생각을 안 할 만큼 못생겼다.","Kite-lines hum between the canyon walls. Somebody, somewhere, is frying something that used to be a bird.":"협곡 벽 사이로 연줄이 잉잉 울린다. 어디선가 누군가가, 예전엔 새였던 걸 튀기고 있다.","For the record? I said this was stupid.":"기록해 두는데? 난 이거 멍청하다고 했어.","Noted. On the kite, off the kite, and twice in the middle when you thought we were going to die.":"적어 뒀어. 연 위에서, 연 아래에서, 그리고 죽는다 싶었을 때 두 번.","We *were* going to die.":"죽을 *뻔했어*.","The man saved our lives in the desert. Several times. Mostly by accident, but a save is a save.":"그 남자가 사막에서 우리 목숨을 구했어. 여러 번. 대개는 우연히, 그래도 구한 건 구한 거야.","He saved his *ship*. We happened to be standing on it.":"그 남자는 *배*를 구한 거야. 우린 마침 그 위에 서 있었고.","Everything left in the world is floating, Pip. We need wings. Corvin's the only captain we know.":"세상에 남은 건 전부 떠 있는 거야, 핍. 우린 날개가 필요해. 우리가 아는 선장은 코르빈뿐이야.","...Knew.":"…알았지.","A year ago Pip followed Corvin around the Halcyon like a gull after a fishing boat. Now he won't say his name.":"일 년 전, 핍은 낚싯배를 따라가는 갈매기처럼 할시온을 따라다녔다. 이제는 그 이름도 꺼내지 않는다.","At the head of the canyon, half-buried in ash, lies a ship. Her masts are snapped. Her lift-sail hangs in rags. On her bow, in chipped gold paint: HALCYON.":"협곡 끝, 재에 반쯤 묻혀 배 한 척이 있다. 돛대는 부러졌다. 양력 돛은 넝마처럼 늘어졌다. 뱃머리에 벗겨진 금빛 물감으로: HALCYON.","Oh. Oh, no. Look at her.":"아. 아, 안 돼. 저것 좀 봐.","That's not wings. That's a grave.":"저건 날개가 아냐. 무덤이야.","Three things. One: find Corvin. Two: find out if that can fly. Three: nobody punches anybody until we've done one and two.":"세 가지. 하나: 코르빈을 찾는다. 둘: 저게 날 수 있는지 알아낸다. 셋: 하나랑 둘을 끝내기 전엔 아무도 아무도 때리지 않는다.","Why are you looking at me?":"왜 나를 보고 그래?","Find Corvin. Someone in the Roost will know where he drinks.":"코르빈을 찾아라. 둥지의 누군가는 그가 어디서 술을 마시는지 알 것이다.","Corvin's Roost. The Halcyon is here, broken in the ash. Pip didn't want to come. I think he wanted to come more than any of us.":"코르빈의 둥지. 할시온이 여기 있다, 재 속에 부서진 채로. 핍은 오기 싫어했다. 아마 우리 중 누구보다 오고 싶어 했을 거다.","Bar's closed.":"술집 닫았어.","Bar's open.":"술집 열었어.","Bar's closed to people who want something. You can tell by the shoes. Hopeful shoes.":"뭘 원하는 인간에게는 닫았어. 신발만 봐도 알아. 기대에 찬 신발이잖아.","Corvin.":"코르빈.","...Huh.":"…허.","Sparrow.":"참새야.","Doc.":"닥터.","Tin-can.":"양철깡통.","It's *Sir* Tin— no. No, it isn't. Carry on.":"*경* 이 양철— 아니다. 아니다, 아니야. 계속해.","Hey, kid.":"이봐, 꼬마.","Don't.":"하지 마.","You got taller.":"키 컸네.","You got *drunker*.":"더 *취했* 네.","That's fair. That's very fair. I worked hard at it.":"그건 맞는 말이야. 아주 맞아. 열심히 노력했거든.","Three things. One: we need your ship. Two: you're going to stop drinking. Three: I wasn't asking.":"세 가지. 하나: 네 배가 필요해. 둘: 당장 술 끊어. 셋: 부탁하는 거 아니야.","Doc, I missed you. Nobody else in this canyon makes lists at me.":"닥터, 보고 싶었어. 이 협곡에서 내게 목록을 읽어 주는 사람은 너뿐이야.","Halcyon's dead. Broke her back coming down into this crack the day the sky did. She's a very expensive place for spiders to live now.":"할시온은 죽었어. 하늘이 무너진 날 이 틈으로 내려오다 허리를 부러뜨렸지. 이제는 거미들이 사는 아주 비싼 집이야.","Then we fix her.":"그럼 고치면 되잖아.","With what? Good intentions? Odessa doesn't take those. I've tried.":"뭘로? 좋은 마음으로? 오데사는 그런 걸 안 받아. 해 봤어.","Who's Odessa?":"오데사가 누구야?","CORVIN ASHE!":"코르빈 애시!","...That's Odessa. Well. That's Odessa's mail.":"…저게 오데사야. 뭐, 오데사의 우편물이고.","By order of the Ledger, your marker has come due. The Ledger Queen sends her regards, and two large men.":"장부의 명령에 따라, 어음 기한이 왔다. 장부 여왕이 안부를 전한다, 그리고 덩치 큰 사내 둘도.","Also a dog.":"개 한 마리도.","Fellas. Kids. Kids, fellas. I'm going to finish my drink.":"친구들. 꼬마들. 꼬마들, 친구들. 나는 이 술을 다 마실 거야.","And the children?":"그리고 아이들은?","*The children* are standing right here.":"*아이들은* 바로 여기 서 있는데.","Well. That was a great deal of my furniture.":"뭐. 내 가구의 상당 부분이었군.","Odessa. You look expensive.":"오데사. 비싸 보이네.","I *am* expensive, darling. That's rather the point of me.":"난 *비싸*, 자기. 그게 바로 내 존재 이유지.","Odessa Quill. I keep the Ledger. Every crate in the Roost is written in it — every bed, every debt, every drink this man has poured into himself since the sky fell.":"오데사 퀼. 내가 장부를 맡고 있어. 둥지의 모든 궤짝이 거기 적혀 있지— 모든 침대, 모든 빚, 하늘이 무너진 뒤로 이자가 자기 몸에 부은 모든 술까지.","Fifty-one thousand, four hundred gold. Plus interest on his charm, which I stopped extending last spring.":"오만 천사백 금화. 그리고 그 매력에 붙은 이자까지, 봄부터는 연장을 끊었어.","Put it on my tab.":"내 외상에 달아 둬.","You *are* the tab, darling.":"자기가 바로 *외상* 이라니까, 자기.","At the next Long Bell I take the Halcyon. Grounded, she's firewood. But firewood is worth something, in a world without a sun.":"다음 긴 종이 울리면 할시온은 내 거야. 땅에 박힌 채로는 땔감이고. 하지만 해 없는 세상에서 땔감도 값은 하지.","Then we'll make her fly. And you'll get your money.":"그럼 우린 그걸 날게 할게. 그러면 돈은 받아.","Red hair. Lanternfall vowels. Halloway, isn't it? The Keeper's girl.":"빨간 머리. 랜턴폴 억양. 할러웨이겠네? 수호자의 딸.","There's a song about you. They sing it on the eastern shards. It isn't a nice one.":"너에 관한 노래가 있어. 동쪽 바위 조각들에서 부르더라. 좋은 노래는 아니야.","She's heard it.":"들었어.","...Hm.":"…흠.","Fix the ship, little Keeper. If she flies before the Long Bell, we'll talk terms. If she doesn't, I'll sell her for kindling and him for parts.":"배를 고쳐, 어린 수호자. 긴 종 전에 날면, 조건을 논의하지. 못 날면, 그 배는 땔감으로 팔고 그자는 부품으로 팔 테다.","Which parts?":"어느 부품?","The charming ones. It won't take long.":"매력적인 부품. 오래 걸리진 않아.","She likes you.":"그 여자가 널 좋아하네.","That was *liking*?":"저게 *좋아한다* 는 거였어?","She didn't charge you for the conversation.":"대화값은 안 받았잖아.","Mags is up at the wreck. She'll tell you what's broken. Short version: everything. Long version: everything, slowly.":"맥스는 난파선 위에 있어. 뭐가 망가졌는지 알려 줄 거야. 요약하면: 전부. 자세히 말하면: 전부, 아주 천천히.","Come with us.":"우리랑 같이 가.","Sparrow. Look at me. Look real close.":"참새야. 나를 봐. 아주 가까이 봐.","This is what's left. You don't want it on your ship.":"이게 남은 거야. 네 배에 싣고 싶진 않겠지.","...Hey—":"…이봐—","_(quietly)_ Kid's still got fast hands.":"_(조용히)_ 꼬마는 아직 손이 빠르네.","Talk to Mags, the Halcyon's engineer, aboard the grounded ship at the head of the canyon.":"협곡 끝 땅에 박힌 배에서 할시온의 기관장 맥스와 이야기하라.","Corvin's alive. He drinks at a bar called the Last Call, which is the least subtle thing I've ever seen. He owes a woman named Odessa more money than Lanternfall ever had.":"코르빈은 살아 있다. 마지막 한잔이라는 술집에서 마시는데, 내가 본 것 중 가장 노골적인 이름이다. 오데사라는 여자에게 랜턴폴이 가졌던 것보다 많은 돈을 빚지고 있다.","Pip unscrews a dented silver flask. He holds it out over the ash, and pours, and does not look away.":"핍이 찌그러진 은제 플라스크의 뚜껑을 연다. 재 위로 내밀어 따르고, 눈을 돌리지 않는다.","Pip—":"핍—","That was probably his last one.":"아마 그게 마지막 한 병이었을 거야.","Good.":"잘됐네.","He taught me to cheat at cards. On the deck, nights. Said a man should know how to lose on purpose, so he'd know how to win when it counted.":"그가 날 카드 사기로 가르쳐 줬어. 밤마다 갑판에서. 사람은 일부러 지는 법을 알아야, 정말 중요한 때 이기는 법도 안다고.","Then the sky broke and he flew *away*.":"그러다 하늘이 무너졌고, 그는 *멀리* 날아가 버렸어.","Pip.":"핍.","I'm fine. I'm twelve. I've been fine for a year.":"난 괜찮아. 난 열두 살이야. 일 년째 괜찮았어.","Pip poured out Corvin's flask. He said he's been fine for a year. He said it the way people say it when they haven't.":"핍이 코르빈의 플라스크를 쏟았다. 일 년째 괜찮다고 했다. 괜찮지 않은 사람들이 하는 방식으로 말했다.","Stop right there. That plank'll hold you, but it won't enjoy it.":"거기 서. 그 널빤지는 버텨 줄 테지만, 좋아하진 않을 거야.","If you're looking for the Captain, try the bottom of a glass. The Last Call. Can't miss it; it's the building that smells like regret.":"선장을 찾는다면, 잔 바닥을 뒤져 봐. 마지막 한잔. 못 놓쳐— 후회 냄새 나는 건물이야.","All three? Then what are you standing there for? Bring 'em to the plank and let me work.":"셋 다? 그럼 왜 서 있어? 널빤지로 데려와. 내가 일하게.","Coil and sail. Two out of three.":"코일하고 돛. 셋 중 둘.","Last one's the heart, and the heart's in Odessa's pocket. Go and charm her at the Ledger House. Or let the redhead do it — the Captain's charm is mortgaged.":"마지막은 심장이고, 심장은 오데사 주머니에 있어. 장부 회관에 가서 그 여자 마음을 사. 아니면 빨간 머리한테 맡겨— 선장의 매력은 저당 잡혔으니까.","Ruddock's barge will take you to the Benediction. You'll find him west, at the Lip.":"러독의 바지선이 베네딕션으로 데려다줄 거야. 서쪽, 입술에서 찾을 수 있어.","Bring me stormsilk. And bring *him* back. I've only just got him up the plank.":"폭풍비단을 가져와. 그리고 *그자*도 데려와. 겨우 널빤지 위로 올려 놨단 말이야.","Hold on to that coil. I'm not bolting anything in until I've got all three — she'll tear herself apart if she lifts half-healed.":"그 코일은 계속 쥐고 있어. 셋 다 모이기 전엔 아무것도 안 조일 거야— 반만 나은 채로 뜨면 배가 스스로 찢어질 테니까.","The lift's on the east wall. Key's in your pocket.":"승강기는 동쪽 벽에 있어. 열쇠는 네 주머니에.","Something down there's been dragging the good scrap into a pile. Scrappers call it the Foreman.":"아래에 뭔가가 좋은 고물을 한 더미로 끌어모으고 있어. 고물꾼들은 그걸 공장장이라 불러.","So you're the kids. He talks about you. When he's drunk enough, which is always, so: constantly.":"그래서 너희구나. 그가 너희 얘기를 해. 충분히 취했을 때, 그러니까 항상, 그러니까 계속.","Can she fly?":"저거 날 수 있어?","Can she— ha! Girl, she's the Halcyon. She was built to fly by people who hated the ground. She *wants* to fly. It's the parts that object.":"날 수 있냐고— 하! 아가씨, 저건 할시온이야. 땅을 싫어하는 사람들이 날도록 만든 배야. 저건 *날고 싶어* 해. 부품들이 거부할 뿐이지.","Here's the butcher's bill.":"자, 청구서다.","One. Her lift-coil's slag — cracked clean through when we came down. There's a dozen wrecks in the Boneyard below the canyon. Sky fell, ships fell with it. Find me a coil that isn't cracked.":"하나. 승력 코일이 녹아 버렸어— 내려올 때 완전히 갈라졌지. 협곡 아래 해골밭에 난파선이 열두 척은 있어. 하늘이 무너지면 배도 같이 떨어졌으니까. 갈라지지 않은 코일을 찾아와.","Two. Her lift-sail's rags. I need stormsilk, and the only stormsilk this side of the abyss is on the *Benediction* — a Choir pilgrim galleon stuck in the Squall east of here. The lightning never stops.":"둘. 승력 돛이 넝마야. 폭풍비단이 필요한데, 이쪽 심연 쪽에서 폭풍비단이 있는 곳은 *베네딕션* 뿐이야— 동쪽 폭풍 속에 박힌 성가대 순례 갤리온이지. 번개가 멈추질 않아."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch9a.json
          cat > i18n/parts/ch9b.json <<'KJSON'
          {"Three. Her heart. Sun-ember core, cracked the day the sun did. The only embers big enough are in the Cinderdeep. Odessa's mine. Odessa's embers. Odessa's terms.":"셋. 심장. 태양불씨 핵인데, 태양이 갈라진 날 같이 갈라졌어. 충분히 큰 불씨는 잿더미 광산에만 있어. 오데사의 광산. 오데사의 불씨. 오데사의 조건.","So: a graveyard, a haunted ship, and a mine owned by a woman who wants to sell our friend for parts.":"그래서: 묘지 하나, 유령선 하나, 그리고 우리 친구를 부품으로 팔려는 여자의 광산 하나.","The *charming* parts? She told you that one. She's proud of that one.":"*매력적인* 부품? 그건 그 여자가 너한테 직접 한 말이지. 그 말을 무척 자랑스러워해.","Start with the Boneyard. Lift's on the east wall. Here.":"해골밭부터 시작해. 승강기는 동쪽 벽에 있어. 여기.","Something down there's been dragging the good scrap into a pile. The scrappers call it the Foreman. You'll know it when it steps on you.":"아래에 뭔가가 좋은 고물을 한 더미로 끌어모으고 있어. 고물꾼들은 그걸 공장장이라 불러. 밟히면 알게 될 거야.","Why are you still here, Mags? If the ship's dead, and the captain's...":"맥스, 왜 아직 여기 있어? 배도 죽었고, 선장도…","Somebody has to be.":"누군가는 있어야지.","He comes up here, you know. Nights. Never comes aboard. Just stands at the bottom of the plank like a dog that's been put out of the house.":"그 사람 여기 와. 밤마다. 배에는 안 올라와. 그냥 널빤지 아래에 서 있어, 집에서 쫓겨난 개처럼.","Go on. Bring me a coil.":"가 봐. 코일이나 가져와.","Take the lift on the east wall down to the Boneyard. Find a lift-coil that isn't cracked.":"동쪽 벽의 승강기를 타고 해골밭으로 내려가라. 갈라지지 않은 승력 코일을 찾아라.","Mags needs three things: a lift-coil from the Boneyard, stormsilk from the Benediction, and a sun-ember heart from Odessa's mine. A graveyard, a ghost ship and a debt.":"맥스에게는 세 가지가 필요하다: 해골밭의 승력 코일, 베네딕션의 폭풍비단, 오데사 광산의 태양불씨 심장. 묘지 하나, 유령선 하나, 그리고 빚 하나.","It's like a graveyard. For ships.":"묘지 같네. 배들의.","It's called the *Boneyard*, Bram.":"*해골밭* 이라고 불러, 브람.","And they named it *well*.":"이름 참 *잘* 지었네.","Stay together. Anything that moves down here is either hungry or sharp.":"떨어지지 마. 여기 움직이는 건 배고프거나 날카롭거나 둘 중 하나야.","Or both. It's usually both.":"아니면 둘 다. 대개 둘 다야.","The winch is thrown. Its chain hangs slack and ticking.":"윈치가 풀려 있다. 사슬이 느슨하게 늘어져 달그락거린다.","A rusted winch, still chained to a magnet crane that hangs out over the yard like a fishing rod.":"녹슨 윈치. 아직 자석 기중기에 사슬로 묶여 있고, 기중기는 낚싯대처럼 마당 위로 뻗어 있다.","The crane swings. Its magnet drags a heap of wreckage aside with a scream of metal — there is a way back toward the lift now.":"기중기가 흔들린다. 자석이 금속 비명과 함께 잔해 더미를 옆으로 끌어낸다— 이제 승강기 쪽으로 돌아갈 길이 생겼다.","Somewhere to the north, a magnet crane groans and swings into place.":"북쪽 어딘가에서 자석 기중기가 신음하며 제자리로 흔들려 들어간다.","With both cranes pulling, the wall of fused hulls to the north tears itself open. Something beyond it stops moving, and listens.":"기중기 둘이 당기자, 북쪽의 뒤엉킨 선체 벽이 스스로 찢어져 열린다. 그 너머에서 무언가 움직임을 멈추고, 귀를 기울인다.","The way to the Foreman's yard (north) is open.":"공장장의 마당(북쪽)으로 가는 길이 열렸다.","Not enough. The northern gate is still held shut — there must be another winch.":"부족해. 북쪽 문은 아직 닫혀 있어— 윈치가 하나 더 있을 거야.","In the yard, wreckage moves. Hull plates slide together with a sound like teeth. A ship's furnace swings up into the place where a heart should be — and lights.":"마당에서 잔해가 움직인다. 선체 판들이 이빨 소리를 내며 맞물린다. 배의 화로가 심장이 있어야 할 자리로 올라온다— 그리고 불이 붙는다.","It's building something.":"뭔가를 짓고 있어.","It's building *itself*.":"*자기 자신* 을 짓고 있어.","Can we fight it before it finishes? I'd like to fight the unfinished version.":"완성되기 전에 싸울 수 있어? 미완성판이랑 싸우고 싶어.","The Foreman comes apart like a sentence nobody finishes. In the cradle of its chest, wrapped in copper and still humming, sits a lift-coil. Whole.":"공장장은 누구도 끝내지 않는 문장처럼 흩어진다. 가슴의 요람 안에, 구리로 감긴 채 아직 웅웅거리며, 승력 코일이 놓여 있다. 온전한.","It is stamped GILDED GULL — SKYREACH YARDS.":"거기엔 GILDED GULL — SKYREACH YARDS라고 찍혀 있다.","One.":"하나.","Don't count. It's bad luck to count.":"세지 마. 세면 재수 없어.","Is it?":"그래?","Corvin says it is.":"코르빈이 그렇대.","_Said._":"_그랬대._","Bring the lift-coil to Mags at the Halcyon.":"할시온의 맥스에게 승력 코일을 가져가라.","The thing in the Boneyard was made of fallen ships, with a furnace for a heart. It had a lift-coil in its chest. Now we do. One down.":"해골밭의 그것은 떨어진 배들로 만들어졌고, 심장 자리에 화로가 있었다. 가슴속에 승력 코일이 있었지. 이제 우리에게 있다. 하나 끝.","Well, look who's at the bottom of my plank again. And look who's behind him.":"어라, 또 누가 내 널빤지 밑에 왔나 했더니. 그리고 그 뒤에 누가 섰는지도 보이네.","Sparrow. You... came back.":"참새야. 너… 돌아왔구나.","We came back.":"우리 모두 돌아왔어.","People don't, much. From the Boneyard.":"사람들은 잘 안 그러지. 해골밭에서는.","People come back, Corvin. It's a thing they *do*. You should try it.":"사람은 돌아와, 코르빈. 그게 사람이 *하는* 일이야. 너도 해 봐.","Coil. Now. Before the pair of you start crying in my ash.":"코일. 어서. 너희 둘이 내 재 위에서 울기 시작하기 전에.","Wren holds up the coil. Mags squints down at it from the deck.":"렌이 코일을 들어 올린다. 맥스는 갑판에서 내려다보며 눈을 가늘게 뜬다.","Gilded Gull. Skyreach yards. Good bones. She'll sing on that.":"길디드 걸. 스카이리치 조선소. 뼈대가 좋아. 저 위에서 노래하겠어.","Hold on to it. I'm not bolting anything in till I've got all three.":"계속 쥐고 있어. 셋 다 모이기 전엔 아무것도 안 조여.","Next is the Benediction.":"다음은 베네딕션이야.","You know it?":"그거 알아?","I've flown pilgrims. Choir pays in gold and hymns, and only one of those spends.":"순례자들을 태워 봤지. 성가대는 금화랑 찬송가로 값을 치르는데, 쓸 수 있는 건 하나뿐이야.","A galleon like that, broke open in a storm — she'll kill you in ways you won't find funny. Stairs that go nowhere. Holds full of things that used to pray.":"그런 갤리온이 폭풍에 배가 갈라졌으면— 웃기지도 않은 방식으로 죽을 거야. 아무 데도 닿지 않는 계단. 예전에 기도하던 것들로 가득한 선창.","Is that an offer?":"그거 제안이야?","It's a weather report.":"일기 예보야.","Corvin. Come with us.":"코르빈. 우리랑 같이 가.","I'm coming for the *ship*, sparrow. Not for—":"난 *배* 때문에 가는 거야, 참새야. 이런—","—any of this. She's the only thing I own that doesn't owe somebody money.":"—이런 거 때문이 아니고. 그 배는 내가 가진 것 중 누구에게도 돈을 안 빚진 유일한 거야.","_(to Wren, quietly)_ That's almost word for word what I said to you. In the Ward.":"_(렌에게, 조용히)_ 내가 너한테 한 말이랑 거의 똑같네. 병동에서.","_(quietly)_ I know. I'm trying very hard not to smile.":"_(조용히)_ 알아. 웃지 않으려고 아주 애쓰는 중이야.","Captain. Catch.":"선장. 받아.","Something heavy sails down from the deck. Corvin catches it without looking: a long-barreled hand-cannon, oiled, gleaming.":"갑판에서 무거운 무언가가 날아 내려온다. 코르빈이 보지도 않고 받는다: 긴 총열의 손대포, 기름 먹인 채 반짝인다.","Cleaned it every week. Didn't know who for.":"매주 닦았어. 누구를 위해서인지는 몰랐지.","Mags. You beautiful wrench.":"맥스. 이 고마운 렌치 같은 녀석.","You're not staying.":"넌 남는 거 아니야.","I'm here, ain't I?":"여기 있잖아, 안 그래?","You were here before, too.":"전에도 여기 있었어.","Ask Ruddock the ferryman (the Lip, west of town) to take you to the wreck of the Benediction.":"마을 서쪽 입술에서 뱃사공 러독에게 베네딕션의 난파선으로 데려다 달라고 하라.","Corvin is coming. \"For the ship,\" he says. Ilse made a face at me like she was remembering something. Pip didn't say anything. Then he said the worst possible thing, which was the truth.":"코르빈이 온다. \"배 때문\"이라고 한다. 일세는 뭔가 떠올린 사람처럼 내게 얼굴을 찡그렸다. 핍은 아무 말도 하지 않았다. 그러다 최악의 말을 했다. 사실인 말을.","Toll Barge. Odessa's barge, Odessa's toll.":"통행 바지선. 오데사의 바지선, 오데사의 통행료.","Goes where she says. Today she says nowhere.":"그 여자가 말하는 데만 간다. 오늘은 아무 데도 안 간대.","Nowhere to go but where she says.":"그 여자가 말하는 곳 말고는 갈 데도 없지.","Get the Captain up that plank first, then we'll talk about where. Odessa wants that ship flying. Says it's worth more alive.":"먼저 선장을 저 널빤지 위로 올려. 그다음에 어디로 갈지 얘기하지. 오데사는 그 배가 날기를 원해. 살아 있어야 값이 더 나간대.","Toll's two hundred a head.":"통행료는 한 명당 은화 이백 닢.","...She said you'd say that.":"…그 여자가 너도 그렇게 말할 거라고 하더라.","She said to say yes.":"그러니까 좋다고 하랬어.","That woman frightens me in ways I've never been frightened.":"그 여자가 날 무섭게 만드는데, 그런 식으로 무서운 적은 없었어.","Where to?":"어디로 갈까?","Stay in the Roost":"둥지에 머문다.","The Toll Barge drops off the Lip on a sigh of hot air and slides out across the dark.":"통행 바지선이 뜨거운 숨을 내쉬며 입술에서 사람들을 내려놓고, 어둠 위로 미끄러져 나간다.","The Squall has not stopped for a year. Rain falls sideways, upward, every way but down.":"폭풍은 일 년째 멈추지 않았다. 비가 옆으로, 위로, 아래로만 빼고 사방으로 내린다.","Pinned to the crag like a moth to a board, the galleon Benediction groans in the wind.":"바위 벽에 나방처럼 못 박힌 갤리온 베네딕션이 바람 속에서 신음한다.","Somewhere aboard, people are singing.":"배 어딘가에서 사람들이 노래하고 있다.","Please tell me that's the wind.":"제발 그거 바람이라고 해 줘.","That's not the wind, tin-can.":"바람 아니야, 양철깡통.","Pilgrim hymn. \"Rest Ye, Dawn-Bound.\" They'd sing it on the approach to Aurenne.":"순례자의 찬송. \"쉬어 가소서, 새벽으로 가는 자여.\" 아우렌에 접근할 때 부르던 노래야.","They were flying in to hear the Vespersong. Best seats in the sky.":"저들은 저녁성가를 들으러 날아오던 중이었어. 하늘의 가장 좋은 자리.","There's a ward of light around the mainmast. It pulses when they sing.":"주 돛대 둘레에 빛의 결계가 있다. 노래할 때마다 맥이 뛴다.","Then we stop the singing. Galleons like her carry two hymn-censers: one on the forecastle, one in the chapel down in the hold.":"그럼 노래를 멈추자. 저런 갤리온에는 찬송 향로가 두 개 있어: 하나는 예선 갑판에, 하나는 아래 선창 예배당에.","And kid — the masts on these things are hollow. Something always nests in a hollow mast.":"그리고 꼬마— 이런 배의 돛대는 비어 있어. 빈 돛대엔 뭐든 둥지를 틀게 마련이지.","Why would you tell me that.":"왜 그런 말을 해.","Silence the two hymn-censers — on the forecastle and in the spilled hold — to break the ward around the mainmast.":"주 돛대 둘레의 결계를 끊으려면 두 찬송 향로— 예선 갑판과 무너진 선창의 것—의 노래를 멈춰라.","The Benediction. A Choir pilgrim galleon, pinned in a storm that hasn't stopped for a year. The pilgrims are still singing. They were flying in to hear the Vespersong.":"베네딕션. 성가대의 순례 갤리온, 일 년째 멈추지 않는 폭풍에 못 박혀 있다. 순례자들은 아직 노래한다. 저들은 저녁성가를 들으러 날아오던 중이었다.","The censer is cold and shut. This part of the hymn is over.":"향로는 차갑고 닫혀 있다. 찬송의 이 부분은 끝났다.","A brass censer, still smoking after a year. The hymn rises out of it like heat off a road.":"일 년이 지나도 연기가 나는 놋쇠 향로. 그 안에서 찬송이 도로 위의 열기처럼 피어오른다.","As your hand touches the lid, the singing stops. All of it. Then, behind you, every pilgrim on the deck turns its head at once.":"손이 뚜껑에 닿자 노래가 멈춘다. 전부. 그러고는 등 뒤에서, 갑판 위의 모든 순례자가 한꺼번에 고개를 돌린다."}
          KJSON
          sed -i 's/^ *//' i18n/parts/ch9b.json
          git add i18n/parts/ch9a.json i18n/parts/ch9b.json
          git commit -m "ko: 9장 1/3(코르빈의 둥지·오데사)"
          git push origin HEAD:main
