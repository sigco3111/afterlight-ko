name: ko-w3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          rm -f /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          echo '' >> /tmp/b
          base64 -d /tmp/b > 'i18n/parts/ch10c.json'
          node -e "const d=JSON.parse(require('fs').readFileSync('i18n/parts/ch10c.json','utf8'));const n=Object.keys(d).length;console.log('entries',n);if(n!==186)process.exit(1)"
          git add 'i18n/parts/ch10c.json'
          git commit -m "ko: 10장 c(세이블의 편지·부탁)"
          git push origin HEAD:main
