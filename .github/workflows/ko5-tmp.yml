{
  "name": "ko5-tmp",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "go/**"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "run": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": 20
          }
        },
        {
          "name": "run",
          "run": "node go/ko5-run.mjs"
        },
        {
          "name": "commit",
          "run": "git config user.name github-actions[bot]\ngit config user.email 41898282+github-actions[bot]@users.noreply.github.com\ngit add -A i18n/parts go\ngit commit -m \"i18n: 5차 러너 결과 반영 [skip ci]\" || echo nothing\ngit pull --rebase -q || true\ngit push || echo nopush"
        }
      ]
    }
  }
}
