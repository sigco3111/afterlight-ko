name: tmp-extract
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract
        run: |
          cat > /tmp/ex.mjs <<'SCRIPT'
import fs from 'fs';
const dict = JSON.parse(fs.readFileSync('src/i18n/ko.json', 'utf8'));
const srcs = process.argv.slice(2);
const all = [];
for (const f of srcs) {
  const text = fs.readFileSync(f, 'utf8');
  const found = [];
  const re = /(['"])((?:\\\\.|(?!\\1)[^\\\\\\n])*)\\1|`((?:\\\\.|[^`\\\\])*)`/g;
  let m;
  while ((m = re.exec(text))) {
    let raw = m[1] ? m[2] : m[3];
    if (!raw) continue;
    if (raw.includes('\${')) continue;
    let s;
    try { s = JSON.parse('"' + raw.replace(/\\\\'/g, "'").replace(/"/g, '\\"') + '"'); } catch (e) { s = raw; }
    if (s.length < 2) continue;
    if (!/[A-Za-z]/.test(s)) continue;
    if (/^[a-z][a-zA-Z0-9]*$/.test(s)) continue;
    if (/^(\\.\\.?|\\/)/.test(s)) continue;
    if (s.startsWith('#')) continue;
    if (s.includes('://')) continue;
    if (/^[A-Za-z0-9_\\-]+\\.(js|css|png|json|mp3|ogg|webp)$/.test(s)) continue;
    if (/^[a-z0-9_\\-]+$/.test(s)) continue;
    if (dict[s] !== undefined) continue;
    if (found.includes(s)) continue;
    found.push(s);
  }
  all.push({ file: f, count: found.length, items: found });
}
fs.rmSync('_extract', { recursive: true, force: true });
fs.mkdirSync('_extract', { recursive: true });
fs.writeFileSync('_extract/summary.json', JSON.stringify(all.map(a => ({ file: a.file, count: a.count })), null, 1));
let n = 0, buf = [], size = 2, idx = 1;
const flush = () => {
  if (!buf.length) return;
  fs.writeFileSync('_extract/miss-' + String(idx).padStart(2, '0') + '.json', JSON.stringify(buf, null, 0));
  idx++; buf = []; size = 2;
};
for (const a of all) {
  for (const s of a.items) {
    const add = s.length + 6;
    if (size + add > 4200) flush();
    buf.push(s); size += add; n++;
  }
}
flush();
console.log('total missing', n, 'chunks', idx - 1, JSON.stringify(all.map(a => a.file + ':' + a.count)));
SCRIPT
          node /tmp/ex.mjs src/story/ch12.js src/story/ch12_finale.js
      - name: commit
        run: |
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add _extract
          git commit -m "tmp: 미번역 문자열 추출" || echo nothing
          git push
