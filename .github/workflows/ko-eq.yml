name: ko-eq
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/eq.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const m = await import(path.resolve('src/data/equipment.js'));
          const T={Sword:'검',Greatsword:'대검',Spear:'창',Axe:'도끼',Dagger:'단검',Bow:'활',Staff:'지팡이',Rod:'마법봉',Knuckles:'권갑',Instrument:'악기',Tome:'책',Gun:'총','Heavy armor':'중갑','Light armor':'경갑',Robe:'법의',Headgear:'머리 장비',Shield:'방패'};
          const out={}; const miss=[];
          const add=(d)=>{ if(!d) return;
            let x=d.match(/^(.+)\. Tier (\d+)\.$/);
            if(x){ const t=x[1].trim(); if(t==='Shield. Raises evasion'){ out[d]='방패. 회피 상승. '+x[2]+'등급.'; return; } if(T[t]){ out[d]=T[t]+'. '+x[2]+'등급.'; return; } miss.push(d); return; }
            const y=d.match(/^.+\..*Raises evasion\. Tier (\d+)\.$/);
            if(y){ out[d]='방패. 회피 상승. '+y[1]+'등급.'; return; }
            miss.push(d);
          };
          for(const v of Object.values(m)){ const list=Array.isArray(v)?v:Object.values(v); for(const e of list){ if(e&&typeof e==='object') add(e.desc); } }
          fs.writeFileSync('i18n/parts/eq-desc.json', JSON.stringify(out,null,1));
          console.log('done', Object.keys(out).length, 'miss', miss.length, JSON.stringify(miss.slice(0,10)));
          JS
          node /tmp/eq.mjs
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add -A
          git commit -m "i18n: 장비 설명(등급) 사전 생성(parts/eq-desc.json)" || true
          git push
